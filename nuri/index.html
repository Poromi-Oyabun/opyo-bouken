<script>
/* ===== art.js ===== */
/* ============================================================
 * art.js — ぬりぬり ワンだふる！ アート（担当A）
 * すべてコード生成のドット絵（外部画像・フォントなし）。
 * makeArt() → ART（中身はすべて HTMLCanvasElement）
 * ============================================================ */
function makeArt() {
  'use strict';

  // ------------------------------------------------------------
  // ピクセルバッファ（値は 0=透明 / 1文字キー / 色文字列）
  // ------------------------------------------------------------
  function B(w, h) { return { w: w, h: h, d: new Array(w * h).fill(0) }; }
  function gp(b, x, y) { return (x < 0 || y < 0 || x >= b.w || y >= b.h) ? 0 : b.d[y * b.w + x]; }
  function sp(b, x, y, v) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= b.w || y >= b.h) return;
    b.d[y * b.w + x] = v;
  }
  function stamp(b, rows, ox, oy) {
    ox = ox || 0; oy = oy || 0;
    for (let y = 0; y < rows.length; y++) {
      const r = rows[y];
      for (let x = 0; x < r.length; x++) {
        const c = r[x];
        if (c !== '.' && c !== ' ') sp(b, ox + x, oy + y, c);
      }
    }
  }
  // 左半分だけ書いて左右対称に
  function sym(rows) { return rows.map(function (r) { return r + r.split('').reverse().join(''); }); }
  // 外側1pxの輪郭（4近傍）
  function outline(b, key) {
    key = key || 'O';
    const o = B(b.w, b.h); o.d = b.d.slice();
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
      if (gp(b, x, y)) continue;
      if (gp(b, x - 1, y) || gp(b, x + 1, y) || gp(b, x, y - 1) || gp(b, x, y + 1)) o.d[y * b.w + x] = key;
    }
    return o;
  }
  function over(dst, src, ox, oy) {
    ox = ox || 0; oy = oy || 0;
    for (let y = 0; y < src.h; y++) for (let x = 0; x < src.w; x++) {
      const v = src.d[y * src.w + x];
      if (v) sp(dst, x + ox, y + oy, v);
    }
  }
  function flipB(b) {
    const o = B(b.w, b.h);
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) o.d[y * b.w + (b.w - 1 - x)] = b.d[y * b.w + x];
    return o;
  }
  function each(b, fn) {
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
      const i = y * b.w + x;
      const nv = fn(b.d[i], x, y);
      if (nv !== undefined) b.d[i] = nv;
    }
  }
  function ell(b, cx, cy, rx, ry, v) {
    for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
      for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) sp(b, x, y, v);
      }
  }
  function rect(b, x, y, w, h, v) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) sp(b, x + i, y + j, v); }
  function line(b, x0, y0, x1, y1, v) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      sp(b, x0, y0, v);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  function poly(b, pts, v) {
    let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
    pts.forEach(function (p) { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
    for (let y = Math.floor(miny); y <= Math.ceil(maxy); y++) for (let x = Math.floor(minx); x <= Math.ceil(maxx); x++) {
      const px = x + 0.5, py = y + 0.5;
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
        if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
      }
      if (inside) sp(b, x, y, v);
    }
  }
  // Catmull-Rom 曲線（n=単位長あたりのサンプル数）
  function spline(pts, n) {
    if (pts.length < 2) return pts.map(function (p) { return p.slice(); });
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      const seg = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) * n));
      for (let k = 0; k < seg; k++) {
        const t = k / seg, t2 = t * t, t3 = t2 * t;
        const f = function (a0, a1, a2, a3) {
          return 0.5 * (2 * a1 + (-a0 + a2) * t + (2 * a0 - 5 * a1 + 4 * a2 - a3) * t2 + (-a0 + 3 * a1 - 3 * a2 + a3) * t3);
        };
        out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    out.push(pts[pts.length - 1].slice());
    return out;
  }
  function brush(b, pts, r0, r1, v, n) {
    const P = spline(pts, n || 3);
    for (let i = 0; i < P.length; i++) {
      const t = P.length > 1 ? i / (P.length - 1) : 0;
      const r = r0 + (r1 - r0) * t;
      ell(b, P[i][0], P[i][1], r, r, v);
    }
  }
  function rng(seed) {
    let s = (seed >>> 0) || 1;
    return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  }

  // ------------------------------------------------------------
  // 色とキャンバス化
  // ------------------------------------------------------------
  const CC = {};
  function rgba(c) {
    if (CC[c]) return CC[c];
    let r = 0, g = 0, bl = 0, a = 255;
    if (c[0] === '#') {
      let h = c.slice(1);
      if (h.length === 3) h = h.split('').map(function (z) { return z + z; }).join('');
      r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); bl = parseInt(h.slice(4, 6), 16);
      if (h.length === 8) a = parseInt(h.slice(6, 8), 16);
    } else {
      const m = c.match(/[\d.]+/g);
      r = +m[0]; g = +m[1]; bl = +m[2]; if (m[3] !== undefined) a = Math.round(+m[3] * 255);
    }
    return (CC[c] = [r, g, bl, a]);
  }
  function mk(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }
  function toCanvas(b, pal) {
    const cv = mk(b.w, b.h), ctx = cv.getContext('2d');
    const id = ctx.createImageData(b.w, b.h), D = id.data;
    for (let i = 0; i < b.d.length; i++) {
      let v = b.d[i];
      if (!v) continue;
      if (pal && Object.prototype.hasOwnProperty.call(pal, v)) v = pal[v];
      if (!v || v.length < 4) continue;
      const c = rgba(v);
      D[i * 4] = c[0]; D[i * 4 + 1] = c[1]; D[i * 4 + 2] = c[2]; D[i * 4 + 3] = c[3];
    }
    ctx.putImageData(id, 0, 0);
    return cv;
  }

  // ------------------------------------------------------------
  // 共通パレット
  // ------------------------------------------------------------
  const SHADOW = 'rgba(90,58,24,0.30)';
  const C0 = { e: '#1c1014', h: '#ffffff', n: '#1c1014', t: '#ff6b8a', q: '#ff8fa8', k: '#ffd23f', K: '#a87400', Z: SHADOW };
  const TEAM = {
    1: { c: '#ff8a1f', C: '#b84f00', L: '#ffc98a' },  // 柴犬チーム（オレンジ）
    2: { c: '#2ad4b8', C: '#0b8a76', L: '#a6f5e8' }   // ネコ団（ミント）
  };
  const DOGK = {
    poromi: { b: '#d46d27', s: '#a44f16', g: '#ad5a19', w: '#fff6e6', y: '#fbd29a', p: '#f79aa6', o: '#3a1a0a' },
    shiro:  { b: '#f6ead2', s: '#d9c39a', g: '#d9c39a', w: '#ffffff', y: '#f6ead2', p: '#f7a6b2', o: '#4a3020' },
    goma:   { b: '#c88b4e', s: '#8a5a32', g: '#3a2a20', w: '#fff1dc', y: '#f4d6a2', p: '#f29ea6', o: '#22140c' }
  };
  const CATK = {
    tora: { b: '#b8bcc6', s: '#8d929e', g: '#555a66', G: '#555a66', w: '#f6f6f8', i: '#7fd640', p: '#ffa0b2', o: '#23262d', x: '#23262d' },
    kuro: { b: '#353042', s: '#221e2c', g: '#353042', G: '#353042', w: '#4d475c', i: '#ffd83a', p: '#f08aa0', o: '#0d0a12', x: '#0d0a12' },
    mike: { b: '#fffaf0', s: '#e0d4c2', g: '#f39a3c', G: '#383040', w: '#ffffff', i: '#f0b828', p: '#ffa0b2', o: '#3a2a20', x: '#3a2a20' }
  };
  function palOf(kindPal, team) {
    const p = Object.assign({}, C0, kindPal, team === 1 ? { c: TEAM[1].c, C: TEAM[1].C } : { c: TEAM[2].c, C: TEAM[2].C });
    p.O = p.o; p.m = p.o;
    if (!p.x) p.x = p.o;
    return p;
  }

  // ------------------------------------------------------------
  // テンプレート（b=体 s=影 w=白(裏白) p=耳の内側 e=目 h=ハイライト n=鼻
  //  t=舌 q=ネコ鼻 i=ネコの瞳 y=眉/明るい毛 c/C=チーム色 k/K=鈴 o=線）
  // ------------------------------------------------------------
  const DOG_HEAD = {
    down: sym([
      '............',
      '............',
      '....b.......',
      '...bpb......',
      '...bppb.....',
      '...bpppb....',
      '..bbpppbbbbb',
      '..bbbbbbbbbb',
      '..bbbbyybbbb',
      '..bbbbhebbbb',
      '..bbbbeebbww',
      '..wwbbbbbwwn',
      '..wwwwwwwwwo',
      '...wwwwwwwot',
      '....wwwwwwww'
    ]),
    up: sym([
      '............',
      '............',
      '....b.......',
      '...bbb......',
      '...bbbb.....',
      '...bbbbb....',
      '..bbbbbbbbbb',
      '..bbbbbbbbbb',
      '..bbbbbbbbbb',
      '..bbbbbbbbbb',
      '..bbbbbbbbbb',
      '..wbbbbbbbbb',
      '..wwbbbbbbbb',
      '...wwbbbbbbb',
      '....ssssssss'
    ]),
    left: [
      '........................',
      '........................',
      '........b...............',
      '.......bpb..............',
      '.......bppb.............',
      '......bbppbb............',
      '.....bbbbbbbb...........',
      '....byybbbbbbb..........',
      '...bbhebbbbbbbb.........',
      '...bbeebbbbbbbb.........',
      '.nbbbbbbbbbbbbb.........',
      '.wwwwwbbbbbbbbb.........',
      '..towwwbbbbbbb..........',
      '...wwwwwwbbbb...........',
      '.....wwwwww.............'
    ]
  };
  const DOG_BODY = {
    down: sym([
      '....bbbbbbbb',
      '....bbbbbbbb',
      '....bccccccc',
      '....bwCccccc',
      '....bwwwCccc',
      '....bbwwwwCC'
    ]),  // y=14..19
    up: sym([
      '....bbbbbbbb',
      '....oooooooo',
      '....cccccccC',
      '....oooooooC',
      '....bbbbbbbb',
      '....sbbbbbbb'
    ]),  // y=14..19
    left: [
      '..........bbbbbbbbb.....',
      '.........bbbbbbbbbbbb...',
      '........bbbbbbbbbbbbb...',
      '........bbbbbbbbbbbbb...',
      '........bbbbbbbbbbbbb...',
      '........bbboooobbbbbb...',
      '........wbcccccbbbbbb...',
      '........wwccccwwbbbbb...',
      '.........wwCCwwwwwbb....',
      '..........wwwwwwwbb.....'
    ]    // y=9..18
  };
  const DOG_TAIL = {
    down: ['.bb.', 'bwwb', 'bwbb', '.bb.'],
    up: ['.bbbb.', 'bbwwbb', 'bw..wb', 'bw..wb', 'bbwwbb', '.bbbb.'],
    left: ['..bbb.', '.bwwwb', 'bwbbbb', 'bwbsbb', '.bwwbb', '..bbbb']
  };

  const CAT_HEAD = {
    down: sym([
      '............',
      '....b.......',
      '....bb......',
      '....bpb.....',
      '....bppb....',
      '...bbpppb...',
      '...bbbbbbbbb',
      '...bbbbbbbbb',
      '...bbbbbbbbb',
      '...bbbheibbb',
      '...bbbieibww',
      '...bbbbbwwwq',
      '...bbbbbwowo',
      '....bbbbwwow',
      '.....bbbbbbb'
    ]),
    up: sym([
      '............',
      '....b.......',
      '....bb......',
      '....bbb.....',
      '....bbbb....',
      '...bbbbbb...',
      '...bbbbbbbbb',
      '...bbbbbbbbb',
      '...bbbbbbbbb',
      '...bbbbbbbbb',
      '...bbbbbbbbb',
      '...bbbbbbbbb',
      '...bbbbbbbbb',
      '....bbbbbbbb',
      '.....sssssss'
    ]),
    left: [
      '........................',
      '.......b..s.............',
      '......bb..ss............',
      '......bpb.sss...........',
      '.....bbppbbsss..........',
      '....bbbbbbbbbbb.........',
      '...bbbbbbbbbbbb.........',
      '...bbehbbbbbbbbb........',
      '..bbbeibbbbbbbbb........',
      '..qwwbbbbbbbbbbb........',
      '..wwwwbbbbbbbbbb........',
      '...owwwbbbbbbbb.........',
      '....wwwwbbbbbb..........',
      '......bbbbbbb...........'
    ]
  };
  const CAT_BODY = {
    down: sym([
      '.....bbbbbbb',
      '.....bbbbbbb',
      '.....ccccccc',
      '.....bwwwwwk',
      '.....bwwwwwK',
      '.....bbwwwww'
    ]),  // y=14..19
    up: sym([
      '.....bbbbbbb',
      '.....ccccccc',
      '.....bbbbbbb',
      '.....bbbbbbb',
      '.....bbbbbbb',
      '.....sbbbbbb'
    ]),
    left: [
      '...........bbbbbbbb.....',
      '..........bbbbbbbbbb....',
      '.........bbbbbbbbbbbb...',
      '.........bbbbbbbbbbbb...',
      '.........bbccbbbbbbbb...',
      '.........wccbbbbbbbbb...',
      '.........wccwwwbbbbbb...',
      '..........kwwwwwwbbb....',
      '...........wwwwwwbb.....'
    ]    // y=10..18
  };
  // ネコのヒゲ（輪郭の後に重ねる）左側のみ。右は鏡像
  const WHISK_D = [[0, 11], [1, 11], [2, 11], [2, 12], [1, 13], [0, 13]];
  const WHISK_L = [[0, 10], [1, 10], [0, 12], [1, 12], [1, 11]];

  // ------------------------------------------------------------
  // 毛柄
  // ------------------------------------------------------------
  function topMap(b) {
    const top = new Array(b.w).fill(99);
    for (let x = 0; x < b.w; x++) for (let y = 0; y < b.h; y++) if (b.d[y * b.w + x]) { top[x] = y; break; }
    return top;
  }
  function patDog(kind, part, dir, b) {
    if (kind !== 'goma') return;
    const top = topMap(b);
    each(b, function (v, x, y) {
      if (v !== 'b') return;
      const d = y - top[x];
      if (d <= 1) return ((x + y) & 1) ? 'g' : 's';
      if (d === 2) return ((x + y) & 1) ? 's' : 'b';
      if (d === 3 && ((x + y) % 4 === 0)) return 's';
    });
  }
  function patCat(kind, part, dir, b) {
    if (kind === 'tora') {
      const top = topMap(b);
      each(b, function (v, x, y) {
        if (v !== 'b') return;
        const d = y - top[x];
        if (part === 'head') {
          if (dir === 'left') { if (d >= 1 && d <= 2 && x % 2 === 1 && x >= 7) return 'g'; }
          else {
            if (y >= 6 && y <= 8 && (x === 9 || x === 11 || x === 12 || x === 14)) return 'g';
            if ((y === 10 || y === 12) && (x <= 4 || x >= 19)) return 'g';
          }
        } else if (part === 'body') {
          if (dir === 'left') { if (x % 3 === 0 && d <= 4) return 'g'; }
          else if (dir === 'up') { if (y % 2 === 0 && y >= 16) return 'g'; }
          else { if ((x <= 6 || x >= 17) && y % 2 === 1) return 'g'; }
        } else if (part === 'tail') { if ((x + y) % 3 === 0) return 'g'; }
      });
    } else if (kind === 'mike') {
      each(b, function (v, x, y) {
        if (v !== 'b') return;
        if (part === 'head') {
          if (dir === 'down') { if (x <= 9 && y <= 8) return 'g'; if (x >= 15 && y <= 8) return 'G'; }
          else if (dir === 'up') { if (x >= 14 && y <= 8) return 'g'; if (x <= 9 && y <= 8) return 'G'; }
          else { if (y <= 6 && x >= 9) return 'G'; if (y <= 7 && x <= 8 && x >= 4) return 'g'; }
        } else if (part === 'body') {
          if (dir === 'down') { if (x >= 16 && y <= 17) return 'g'; if (x <= 6 && y >= 16) return 'G'; }
          else if (dir === 'up') {
            if ((x - 8) * (x - 8) + (y - 16) * (y - 16) <= 7) return 'G';
            if ((x - 16) * (x - 16) + (y - 18) * (y - 18) <= 6) return 'g';
          } else {
            if ((x - 14) * (x - 14) + (y - 12) * (y - 12) <= 8) return 'G';
            if ((x - 19) * (x - 19) + (y - 15) * (y - 15) <= 5) return 'g';
          }
        } else if (part === 'tail') { return (y % 3 === 0) ? 'G' : 'g'; }
      });
    }
  }

  // ------------------------------------------------------------
  // 足・影
  // ------------------------------------------------------------
  function shadow(b, cx, cy, rx, ry) { ell(b, cx, cy, rx, ry, 'Z'); }
  // 正面/背面の前足2本
  function legsDU(b, xs, w, f, y0) {
    const lift = [[0, 0], [1, 0], [0, 0], [0, 1]][f];
    xs.forEach(function (x, i) {
      const yb = 22 - lift[i];
      for (let y = y0; y <= yb; y++) for (let k = 0; k < w; k++) sp(b, x + k, y, y === yb ? 'w' : 'b');
    });
  }
  // 横向きの4本足  near: 手前（体レイヤー） far: 奥（影色）
  function legsSide(near, far, f, y0, xs, w) {
    // xs: [手前前足, 奥前足, 手前後足, 奥後足]
    const A = { dx: [0, -1, 0, 1][f], lift: f === 1 ? 1 : 0 };   // 手前前足・奥後足
    const Bp = { dx: [0, 1, 0, -1][f], lift: f === 3 ? 1 : 0 };  // 奥前足・手前後足
    const defs = [[xs[0], A, near], [xs[1], Bp, far], [xs[2], Bp, near], [xs[3], A, far]];
    defs.forEach(function (d) {
      const x = d[0] + d[1].dx, yb = 22 - d[1].lift, isFar = d[2] === far;
      for (let y = y0; y <= yb; y++) for (let k = 0; k < w; k++)
        sp(d[2], x + k, y, y === yb ? 'w' : (isFar ? 's' : 'b'));
    });
  }

  // ------------------------------------------------------------
  // 柴犬
  // ------------------------------------------------------------
  function closeEyes(hb, x0, y0) {
    each(hb, function (v) { if (v === 'e' || v === 'h' || v === 'i') return 'b'; });
    const L = [[x0, y0], [x0 + 1, y0 + 1], [x0, y0 + 2]];
    L.forEach(function (p) { sp(hb, p[0], p[1], 'o'); sp(hb, 23 - p[0], p[1], 'o'); });
  }
  function dogBuf(kind, dir, f, opt) {
    opt = opt || {};
    if (dir === 'right') return flipB(dogBuf(kind, 'left', f, opt));
    const out = B(24, 24);
    const bob = (f === 1 || f === 3) ? -1 : 0;
    shadow(out, 12, 22.4, 8.5, 1.7);
    if (dir === 'down' || dir === 'up') {
      const bb = B(24, 24);
      stamp(bb, DOG_BODY[dir], 0, 14 + bob);
      legsDU(bb, [6, 15], 3, f, 20 + bob);
      patDog(kind, 'body', dir, bb);
      const hb = B(24, 24);
      stamp(hb, DOG_HEAD[dir], 0, bob + (dir === 'up' ? -1 : 0));
      patDog(kind, 'head', dir, hb);
      if (opt.closed) closeEyes(hb, 6, 8 + bob);

  // ------------------------------------------------------------
  // 追加アイコン 16x16（ブキ・レアブキ・ロック・アイテム）
  // ------------------------------------------------------------
  const GOLD = { L: '#fff7c2', M: '#ffd23f', D: '#e09400', X: '#a65f00' };
  // 左上=明るい / 右下=暗い の3段かげ（1パーツのバッファ全体に）
  function shade3(b, L, M, D) {
    const src = B(b.w, b.h); src.d = b.d.slice();
    each(b, function (v, x, y) {
      if (!v) return;
      if (!gp(src, x + 1, y + 1) || !gp(src, x, y + 1)) return D;
      if (!gp(src, x - 1, y - 1) || !gp(src, x, y - 1)) return L;
      return M;
    });
  }
  // きらきら（十字の星）
  function twinkle(b, x, y, big) {
    sp(b, x, y, '#ffffff');
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (p) { sp(b, x + p[0], y + p[1], '#fff3a0'); });
    if (big) [[2, 0], [-2, 0], [0, 2], [0, -2]].forEach(function (p) { sp(b, x + p[0], y + p[1], '#ffc21f'); });
  }
  // 骨の形（(x0,y0)→(x1,y1)、軸の太さ r、両端のこぶ kr）
  function boneBuf(x0, y0, x1, y1, r, kr, v) {
    const b = B(16, 16);
    brush(b, [[x0, y0], [x1, y1]], r, r, v, 3);
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L, ux = dx / L, uy = dy / L;
    [[x0, y0, -1], [x1, y1, 1]].forEach(function (e) {
      [1, -1].forEach(function (s) { ell(b, e[0] + nx * s * kr * 0.9 + ux * e[2] * 0.4, e[1] + ny * s * kr * 0.9 + uy * e[2] * 0.4, kr, kr, v); });
    });
    return b;
  }
  // 回転した楕円の多角形
  function rotEll(cx, cy, a, rb, ang, n) {
    const P = [];
    for (let i = 0; i < (n || 20); i++) {
      const t = i / (n || 20) * Math.PI * 2, c = Math.cos(ang), s = Math.sin(ang);
      const x = Math.cos(t) * a, y = Math.sin(t) * rb;
      P.push([cx + x * c - y * s, cy + x * s + y * c]);
    }
    return P;
  }

  // ためうちホース：くるくる巻いた庭のホース＋真ちゅうノズル
  function iconHose() {
    const out = B(16, 16);

    // ノズルへのびるホース
    const tb = B(16, 16);
    brush(tb, [[9.6, 6.4], [11.2, 5.2], [12.2, 4.4]], 1.1, 1.0, HG, 3);
    each(tb, function (v, x, y) { if (v && !gp(tb, x - 1, y - 1)) return HL; });
    over(out, outline(tb, ICO_O));
    // ノズル（真ちゅう）
    const nz = B(16, 16);
    brush(nz, [[11.8, 4.8], [14.4, 2.2]], 1.2, 0.9, '#e8b23a', 3);
    each(nz, function (v, x, y) { if (v && x + y >= 17) return '#a8701a'; if (v && x + y <= 15) return '#fff0a8'; });
    sp(nz, 12, 4, '#a8701a'); sp(nz, 13, 3, '#a8701a');
    over(out, outline(nz, ICO_O));
    // コイル
    // コイル（うずまきを内→外に描き、となりの巻きとの間に影を入れる）
    const c = B(16, 16), idx = new Array(256).fill(-1);
    const SP = [];
    for (let t = 0; t <= Math.PI * 2 * 2.05; t += 0.05) {
      const r = 1.0 + 2.25 * t / (Math.PI * 2);
      SP.push([6.8 + Math.cos(t + 1.2) * r, 10.2 + Math.sin(t + 1.2) * r * 0.86]);
    }
    SP.forEach(function (p, i) {
      const tr = 0.95;
      for (let y = Math.floor(p[1] - 2); y <= p[1] + 2; y++) for (let x = Math.floor(p[0] - 2); x <= p[0] + 2; x++) {
        if (x < 0 || y < 0 || x > 15 || y > 15) continue;
        const d = Math.hypot(x + 0.5 - p[0], y + 0.5 - p[1]), k = y * 16 + x;
        if (d <= tr) { const sd = (x + 0.5 - p[0]) + (y + 0.5 - p[1]); c.d[k] = sd < -0.25 ? HL : (sd > 0.55 ? HD : HG); idx[k] = i; }
        else if (d <= tr + 0.8 && (idx[k] < 0 || idx[k] < i - 40)) { c.d[k] = HX; idx[k] = i; }
      }
    });
    over(out, outline(c, ICO_O));
    // ためたぺんき（しずく）
    sp(out, 15, 0, PL); sp(out, 15, 1, PO); sp(out, 14, 0, PO);
    return toCanvas(out);
  }

// =====================================================================
// ■ ブキ（名前・性能はオリジナル）
//   共通フィールド
//     name        表示名
//     rate        1秒あたりの発射数（mop はふり回数）
//     range       射程(px)。shower/bucket は弾の飛ぶ最大距離、mop は前方にとどく長さ
//     bulletSpeed 弾の速さ(px/秒)（mop は 0 = 即時）
//     paintRadius 着弾でぬる円の半径(セル)。距離 <= paintRadius のセルをぬる
//     dmg         1発あたりのダメージ（hpMax=100 に対して）
//     inkCost     1発あたりのぺんき消費（inkMax=100 に対して）
//     spread      発射方向のぶれ（±度、一様ランダム）
//     walkMul     うっている間の移動速度倍率
//     hitRadius   弾の当たり判定の半径(px)
//   ブキ別
//     shower.trail       弾が飛ぶあいだにぬる足あとの半径(セル)。trailEvery は足あとの間隔(px)の目安
//     mop                うっている間ずっと前方に幅 width(セル) の帯をぬる（連続ぬり）。
//                        rate は「1秒あたりのふり回数」：ぺんき消費 = inkCost*rate /秒、
//                        前方 range(px) 以内の相手に dmg*rate /秒（= 280/秒 → 約0.36秒でびしょびしょ）
//     bucket.arcHeight   放物線の最高点の高さ(px・見た目用)。弾は着弾まで当たらない（低い壁はこえる）
//     bucket.minRange    最短着弾距離(px)。ねらい距離は minRange〜range（スティックの倒し具合で）
//     bucket.directRadius 着弾点から directRadius(px) 以内の相手に dmg（= paintRadius*8*0.55）
//     bucket.splashDmg   それより外側で paintRadius 以内の相手へのダメージ（= dmg*0.5）

// =====================================================================
// ■ バランス
//   速度は px/秒、時間は秒。enemyInkSlow は相手の色の上での移動速度倍率。
//   inkRegen はうっていない時、inkRegenDive はほりほり中の回復量（1秒あたり）。
//   うっている最中は回復しない。inkRegenDelay 秒うたなかったら normal 回復が始まる。
//   hpRegen は hpRegenDelay 秒ダメージを受けなかったら1秒あたり回復する量。
//   bombGaugeCells：自分で新しくぬったセル数（相手色をぬり返した分もふくむ）でゲージ満タン。
//   bombRadius(セル)の円をぬり、bombWetRadius(セル)以内の相手は bombDmg（目安）。
//   lastSpurtSec：残りこの秒数でラストスパート（BGM切替。lastSpurtGaugeMul はゲージ増加倍率・任意）。
//   cpu：
//     react        相手を見つけてから撃ちはじめるまで(秒)
//     aimErr       ねらいのぶれ（±度）
//     paintPref    ぬり優先の割合（0〜1）。相手が見えても、この確率でぬりを続ける（1-paintPref が攻め）
//     diveRate     移動中にほりほりを使う頻度（0〜1。自分色の上・ぺんき少ない時は優先）
//     fireRange    ブキ射程の何倍の距離から撃ちはじめるか
//     viewRange    相手に気づく距離(px)
//     attackRatio  攻めの割合（= 1 - paintPref。参考値）

//     bombUse      ゲージ満タン時に、相手が近い/周りが相手色ならボムを使う確率（毎秒判定）

/* ---------- canvas ---------- */

function resize(){DPR=Math.min(window.devicePixelRatio||1,3);const w=innerWidth,h=innerHeight;cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';

function safeBottom(){try{const d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom)';document.body.appendChild(d);const v=parseFloat(getComputedStyle(d).paddingBottom)||0;d.remove();return v}catch(e){return 0}}

/* ---------- stage build ---------- */
let base,over,overB,paintC,pctx,miniC,mctx,props=[];
function shade(h,f){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return`rgb(${r},${g},${b})`}
function cellAt(cx,cy){if(cx<0||cy<0||cx>=GW||cy>=GH)return'~';return S.map[cy][cx]}
function blockedPx(x,y){return BLOCK.has(cellAt(Math.floor(x/CELL),Math.floor(y/CELL)))}
function solidPx(x,y){return SOLIDB.has(cellAt(Math.floor(x/CELL),Math.floor(y/CELL)))}
function paintable(cx,cy){const c=cellAt(cx,cy);return c==='.'||c==='1'||c==='2'}
function buildStage(i){
  const st=STG[i];S.map=st.map.map(r=>r.split(''));S.grid=new Uint8Array(GW*GH);
  base=mk(WW,WH);over=mk(WW,WH);overB=mk(WW,WH);paintC=mk(WW,WH);pctx=paintC.getContext('2d');miniC=mk(GW,GH);mctx=miniC.getContext('2d');
  const b=base.getContext('2d');let total=0;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const c=S.map[y][x];if(paintable(x,y))total++;
    const t=ART.sand[(x*7+y*13+((x*y)%5))%ART.sand.length];b.drawImage(t,x*CELL,y*CELL);
    if(c==='1'||c==='2'){b.fillStyle=c==='1'?'rgba(255,138,31,.10)':'rgba(42,212,184,.10)';b.fillRect(x*CELL,y*CELL,CELL,CELL)}}
  S.total=total;if(st.theme&&st.theme.sand){b.globalAlpha=.32;b.fillStyle=st.theme.sand;b.fillRect(0,0,WW,WH);b.globalAlpha=1}
  for(const [cv2,ph] of[[over,0],[overB,1]]){const o=cv2.getContext('2d');
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const c=S.map[y][x];
      if(c==='~'){const sea=(st.theme&&st.theme.sea)||'#2f8fd8';o.fillStyle=sea;o.fillRect(x*CELL,y*CELL,CELL,CELL);
        o.fillStyle='rgba(255,255,255,.18)';if(((x+y*3+ph*2)%7)===0)o.fillRect(x*CELL+1,y*CELL+2+ph*2,4,1);
        // 波打ち際の泡
        for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=cellAt(x+dx,y+dy);if(n!=='~'&&n!==undefined&&!(x+dx<0||y+dy<0||x+dx>=GW||y+dy>=GH)){o.fillStyle='rgba(255,255,255,.75)';
          if(dx===1)o.fillRect(x*CELL+CELL-2-ph,y*CELL,2,CELL);if(dx===-1)o.fillRect(x*CELL+ph,y*CELL,2,CELL);if(dy===1)o.fillRect(x*CELL,y*CELL+CELL-2-ph,CELL,2);if(dy===-1)o.fillRect(x*CELL,y*CELL+ph,CELL,2)}}}
      else if(c==='#'){const wc=(st.theme&&st.theme.wall)||'#8d8a84';o.fillStyle=wc;o.fillRect(x*CELL,y*CELL,CELL,CELL);o.fillStyle=shade(wc,.3);o.fillRect(x*CELL,y*CELL,CELL,2);o.fillStyle=shade(wc,-.3);o.fillRect(x*CELL,y*CELL+CELL-1,CELL,1);o.fillRect(x*CELL+((y%2)?3:6),y*CELL+2,1,5)}}}
  // props: 連結ブロブごとに1つ
  props=[];const seen=new Uint8Array(GW*GH);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const c=S.map[y][x];if(!'RPCT'.includes(c)||seen[y*GW+x])continue;
    const q=[[x,y]];seen[y*GW+x]=1;let x0=x,x1=x,y0=y,y1=y;
    while(q.length){const[a,bq]=q.pop();x0=Math.min(x0,a);x1=Math.max(x1,a);y0=Math.min(y0,bq);y1=Math.max(y1,bq);
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=a+dx,ny=bq+dy;if(nx>=0&&ny>=0&&nx<GW&&ny<GH&&!seen[ny*GW+nx]&&S.map[ny][nx]===c){seen[ny*GW+nx]=1;q.push([nx,ny])}}}
    const cx=(x0+x1+1)/2*CELL,by=(y1+1)*CELL,w=(x1-x0+1)*CELL,h=(y1-y0+1)*CELL;
    if(c==='T'&&(w>CELL||h>CELL)){for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)if(S.map[yy][xx]==='T')props.push({c,x:(xx+.5)*CELL,y:(yy+1)*CELL,w:CELL,h:CELL});}
    else props.push({c,x:cx,y:by,w,h})}
}

/* ---------- paint ---------- */
function setCell(cx,cy,team,owner){if(!paintable(cx,cy))return 0;const i=cy*GW+cx;if(S.grid[i]===team)return 0;S.grid[i]=team;if(owner)owner.painted++;return 1}
function paint(px,py,r,team,owner,visual=true){
  const cx=px/CELL,cy=py/CELL,R=Math.ceil(r);let n=0;
  for(let y=Math.floor(cy-R);y<=Math.floor(cy+R);y++)for(let x=Math.floor(cx-R);x<=Math.floor(cx+R);x++){
    const dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy<=r*r)n+=setCell(x,y,team,owner)}
  if(owner&&n){owner.gauge=Math.min(BAL.bombGaugeCells,owner.gauge+n);if(owner.human&&owner.gauge>=BAL.bombGaugeCells&&!owner.bombAnn){owner.bombAnn=true;SND.sfx('bombReady')}}
  if(visual)stamp(px,py,r*CELL,team);
  return n}
function stamp(px,py,rad,team){
  pctx.fillStyle=TEAMC[team];pctx.beginPath();pctx.arc(px,py,Math.max(2,rad),0,7);pctx.fill();
  const k=Math.min(6,1+rad/4|0);
  for(let i=0;i<k;i++){const a=Math.random()*7,d=rad*rnd(.7,1.15),s=rnd(1.2,Math.max(1.6,rad*.35));
    pctx.beginPath();pctx.arc(px+Math.cos(a)*d,py+Math.sin(a)*d,s,0,7);pctx.fill()}
  if(rad>5){pctx.fillStyle=TEAML[team];pctx.globalAlpha=.55;pctx.beginPath();pctx.arc(px-rad*.3,py-rad*.35,rad*.28,0,7);pctx.fill();pctx.globalAlpha=1}
}
function teamAt(px,py){const cx=Math.floor(px/CELL),cy=Math.floor(py/CELL);if(cx<0||cy<0||cx>=GW||cy>=GH)return 0;return S.grid[cy*GW+cx]}
function countPaint(){let a=0,b=0;for(let i=0;i<S.grid.length;i++){const g=S.grid[i];if(g===1)a++;else if(g===2)b++}S.counts={1:a,2:b};return S.counts}
function updateMini(){const id=mctx.createImageData(GW,GH),d=id.data;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=(y*GW+x)*4,c=S.map[y][x],g=S.grid[y*GW+x];let r=232,gg=214,bb=168,a=255;
    if(c==='~'){r=47;gg=143;bb=216;a=200}else if(SOLIDB.has(c)){r=110;gg=104;bb=96}else if(g===1){r=255;gg=138;bb=31}else if(g===2){r=42;gg=212;bb=184}
    d[i]=r;d[i+1]=gg;d[i+2]=bb;d[i+3]=a}
  mctx.putImageData(id,0,0)}

/* ---------- players ---------- */
function newPlayer(team,i,weapon,human){const kind=team===1?['poromi','shiro','goma'][i]:['tora','kuro','mike'][i];
  const sp=STG[S.stageIdx].spawn[team][i];
  return{team,i,kind,name:NAMES[kind],weapon,human,x:(sp[0]+.5)*CELL,y:(sp[1]+.5)*CELL,sx:(sp[0]+.5)*CELL,sy:(sp[1]+.5)*CELL,
    dir:team===1?'up':'down',ax:0,ay:team===1?-1:1,hp:BAL.hpMax,ink:BAL.inkMax,state:'alive',t:0,wetT:0,inv:0,diving:false,cd:0,frame:0,walkT:0,
    gauge:0,bombAnn:false,painted:0,splats:0,deaths:0,lastHit:-9,printT:0,
    ai:human?null:{tx:0,ty:0,field:null,retarget:0,seen:0,target:null,strafe:Math.random()<.5?1:-1,diveHold:0,stuck:0,lx:0,ly:0}}}
function canStand(x,y){const r=3.5;return!(blockedPx(x-r,y-r)||blockedPx(x+r,y-r)||blockedPx(x-r,y+r)||blockedPx(x+r,y+r))}
function moveP(p,dx,dy){if(dx&&canStand(p.x+dx,p.y))p.x+=dx;else if(dx){/* 角すべり */if(canStand(p.x+dx,p.y-3))p.y-=1;else if(canStand(p.x+dx,p.y+3))p.y+=1}
  if(dy&&canStand(p.x,p.y+dy))p.y+=dy;else if(dy){if(canStand(p.x-3,p.y+dy))p.x-=1;else if(canStand(p.x+3,p.y+dy))p.x+=1}}
function los(x0,y0,x1,y1){const d=hyp(x1-x0,y1-y0),n=Math.ceil(d/4);for(let k=1;k<n;k++){if(solidPx(x0+(x1-x0)*k/n,y0+(y1-y0)*k/n))return false}return true}
function enemiesOf(p){return S.players.filter(q=>q.team!==p.team&&q.state==='alive')}

function hurt(q,dmg,by){if(q.state!=='alive'||q.inv>0)return;if(by&&by.power>0)dmg*=1.5;q.hp-=dmg;q.lastHit=S.time;
  if(q.human||by&&by.human)SND.sfx('hit');
  for(let k=0;k<3;k++)S.parts.push({type:'drop',x:q.x,y:q.y-6,vx:rnd(-40,40),vy:rnd(-60,-10),t:0,life:.45,team:by?by.team:3-q.team});
  if(q.hp<=0){q.state='wet';q.wetT=0;q.diving=false;q.deaths++;if(by)by.splats++;
    paint(q.x,q.y,2.2,by?by.team:3-q.team,by);SND.sfx('wet');
    pushFeed(`${by?by.name:'?'} が ${q.name} を びしょびしょにした！`,by?by.team:0);
    if(q.human){S.shake=Math.max(S.shake,.25);buzz(90)}
    if(by&&by.human){S.parts.push({type:'txt',t:0,life:1,x:q.x,y:q.y-18,s:'びしょっ！',team:by.team});buzz(25)}}}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- weapons ---------- */
function inkUse(p,c){return p.power>0?c*.25:c}
function fire(p,dt){const w=W8[p.weapon];
  if(w.type==='spin'){const cost=inkUse(p,w.inkCost*w.rate*dt);if(p.ink<cost)return false;
    p.ink-=cost;const R=(w.radius||2.3);p.spin=(p.spin||0)+dt*(w.gold?18:14);
    p.mopV=(p.mopV||0)+dt;if(p.mopV>.09){p.mopV=0;paint(p.x,p.y+2,R,p.team,p,false);for(let k=0;k<3;k++){const a=p.spin+k*2.1;stamp(p.x+Math.cos(a)*R*CELL*.7,p.y+2+Math.sin(a)*R*CELL*.55,rnd(3,5),p.team)}
      S.parts.push({type:'swirl',x:p.x,y:p.y,t:0,life:.18,a:p.spin,team:p.team,R:R*CELL,gold:w.gold})}
    p.mopS=(p.mopS||0)+dt;if(p.mopS>.2){p.mopS=0;if(p.human||near(p))SND.sfx('mop')}
    for(const q of enemiesOf(p)){const d=hyp(q.x-p.x,q.y-p.y);if(d<(w.range||24)+4)hurt(q,w.dmg*w.rate*dt,p)}
    return true}
  if(w.type==='charge'){if(p.ink<inkUse(p,w.minInk||4)&&!p.charge)return false;p.charge=Math.min(1,(p.charge||0)+dt/(w.chargeTime||.85));
    if(p.charge>=1&&!p.chgFull){p.chgFull=1;if(p.human)SND.sfx('bombReady')}return true}
  if(p.cd>0)return true;const cost=inkUse(p,w.inkCost);if(p.ink<cost){return false}
  p.ink-=cost;p.cd=1/w.rate;
  const sp=(w.spread||0)*Math.PI/180,a=Math.atan2(p.ay,p.ax)+rnd(-sp,sp);
  if(w.type==='lob'){const dist=clamp((w.range||84)*(p.human?Math.max(.35,S.input.aimMag||1):(p.ai&&p.ai.aimDist?clamp(p.ai.aimDist/(w.range||84),.3,1):1)),w.minRange||20,w.range||84);
    S.bullets.push({k:'lob',w:p.weapon,x:p.x,y:p.y-4,sx:p.x,sy:p.y-4,tx:p.x+Math.cos(a)*dist,ty:p.y+Math.sin(a)*dist,t:0,T:dist/(w.bulletSpeed||150),team:p.team,owner:p});
    if(p.human||near(p))SND.sfx('bucket')}
  else if(w.type==='wave'){const R=w.range||66,cone=(w.cone||56)*Math.PI/180;
    for(let r=10;r<=R;r+=7)for(let k=-2;k<=2;k++){const aa=a+cone/2*k/2;const x=p.x+Math.cos(aa)*r,y=p.y+Math.sin(aa)*r;if(!solidPx(x,y))paint(x,y,1.3+r/R,p.team,p,(k+r)%2===0)}
    for(const q of enemiesOf(p)){const dx=q.x-p.x,dy=q.y-p.y,d=hyp(dx,dy);if(d<R+6&&d>0&&Math.abs(Math.atan2(Math.sin(Math.atan2(dy,dx)-a),Math.cos(Math.atan2(dy,dx)-a)))<cone/2+.15&&los(p.x,p.y,q.x,q.y))hurt(q,w.dmg,p)}
    S.parts.push({type:'wave',x:p.x,y:p.y-4,a,cone,R,t:0,life:.3,team:p.team});
    if(p.human||near(p)){SND.sfx('bomb');S.shake=Math.max(S.shake,.12)}}
  else{const v=w.bulletSpeed||220;S.bullets.push({k:'shot',w:p.weapon,x:p.x+Math.cos(a)*6,y:p.y-3+Math.sin(a)*6,vx:Math.cos(a)*v,vy:Math.sin(a)*v,d:0,R:(w.range||72)*rnd(.9,1.05),team:p.team,owner:p,tr:0,hue:w.rainbow?(S.time*400)%360:0});
    if(p.human||near(p))SND.sfx('shoot')}
  return true}
function releaseCharge(p){const w=W8[p.weapon],c=p.charge||0;p.charge=0;p.chgFull=0;if(c<=0)return;
  const cost=inkUse(p,(w.minInk||4)+((w.inkCost||14)-(w.minInk||4))*c);if(p.ink<cost*.5)return;p.ink=Math.max(0,p.ink-cost);
  const L=(w.range||150)*(.35+.65*c),a=Math.atan2(p.ay,p.ax),dx=Math.cos(a),dy=Math.sin(a);let x=p.x,y=p.y-3,d=0,hit=null;
  while(d<L){x+=dx*3;y+=dy*3;d+=3;if(solidPx(x,y))break;for(const q of enemiesOf(p)){if(hyp(q.x-x,q.y-3-y)<(w.hitRadius||7)){hit=q;break}}if(hit)break;
    if(d%9<3)paint(x,y+2,(w.width||1.1)*(.7+.5*c),p.team,p,d%18<3)}
  paint(x,y+2,1.4+c,p.team,p);splash(x,y,p.team,6+c*6);
  if(hit)hurt(hit,c>=1?w.dmg:(w.minDmg||30)+(w.dmg-(w.minDmg||30))*c*.6,p);
  S.parts.push({type:'beam',x0:p.x,y0:p.y-3,x1:x,y1:y,t:0,life:.18,team:p.team,full:c>=1});
  if(p.human||near(p)){SND.sfx(c>=1?'splat':'shoot');if(c>=1&&p.human)S.shake=Math.max(S.shake,.1)}}
function near(p){const h=S.players[0];return hyp(p.x-h.x,p.y-h.y)<90}
function bomb(p){if(p.gauge<BAL.bombGaugeCells||p.state!=='alive')return;p.bombAnn=false;p.diving=false;
  const R=BAL.bombRadius;for(let k=0;k<3;k++)setTimeout(()=>{},0);
  paint(p.x,p.y,R,p.team,p);for(let k=0;k<10;k++){const a=k/10*7,d=R*CELL*rnd(.6,1);stamp(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,rnd(4,7),p.team)}
  p.gauge=0;S.rings.push({x:p.x,y:p.y,t:0,life:.6,R:R*CELL+6,team:p.team});
  if(p.human||near(p)){S.flash=.22;S.hitstop=.15;S.parts.push({type:'txt',t:0,life:1.1,x:p.x,y:p.y-26,s:'ワン！',team:p.team,big:1})}
  for(const q of enemiesOf(p)){const d=hyp(q.x-p.x,q.y-p.y);if(d<(BAL.bombWetRadius||4)*CELL)hurt(q,BAL.bombDmg||100,p);else if(d<R*CELL+4)hurt(q,40,p)}
  for(let k=0;k<24;k++)S.parts.push({type:'drop',x:p.x,y:p.y-4,vx:rnd(-120,120),vy:rnd(-140,0),t:0,life:.7,team:p.team});
  if(p.human||near(p)){SND.sfx('bomb');S.shake=Math.max(S.shake,.35)}if(p.human)buzz(60);
  pushFeed(`${p.name}の ワンだふるボム！`,p.team)}

/* ---------- AI ---------- */
function bfsField(tx,ty){const f=new Int16Array(GW*GH).fill(-1),q=[ty*GW+tx];f[ty*GW+tx]=0;let h=0;
  while(h<q.length){const i=q[h++],x=i%GW,y=(i/GW)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const j=ny*GW+nx;if(f[j]>=0||BLOCK.has(S.map[ny][nx]))continue;f[j]=f[i]+1;q.push(j)}}
  return f}
function pickTarget(p){const C=BAL.cpu[p.team===2?S.cpu:'normal'];const ai=p.ai;let best=null,bs=-1e9;

      if(p.human){// エイムアシスト

  UI=[];S.bullets=[];S.parts=[];S.rings=[];S.feed=[];S.item=null;S.itemAt=rnd(30,55);S.goldBone=0;S.newUnl=[];S.left=BAL.matchSec;S.last30=false;S.lastCount=0;S.introT=0;S.introLen=3;S.mode='intro';S.time=0;
  try{S.tut=!localStorage.getItem('nuri_tut');localStorage.setItem('nuri_tut','1')}catch(e){S.tut=true}

function startJudge(){const c=countPaint();const a=c[1]/S.total*100,b=c[2]/S.total*100;
  const h=S.players[0];const win=c[1]>c[2],tie=c[1]===c[2];

  chk('win1',win);chk('goldbone',!!S.goldBone);chk('splat8',h.splats>=8);chk('hard55',win&&S.cpu==='hard'&&a>=55);S.newUnl=nu;S.mode='judge';

let lastT=0,acc=0;const FIX=1/60;
function frame(ts){S.fdt=Math.min(.1,(ts-(S.lastTs||ts))/1000);S.lastTs=ts;if(S.manual){try{draw()}catch(e){console.error(e)}requestAnimationFrame(frame);return}try{const dt=Math.min(.1,(ts-lastT)/1000||0);lastT=ts;if(!S.paused){pollKeys();acc+=dt;let n=0;while(acc>=FIX&&n<6){step(FIX);acc-=FIX;n++}if(n>=6)acc=0}draw()}catch(e){console.error(e)}requestAnimationFrame(frame)}
