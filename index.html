<style>
/* layout: a handheld console — square game screen on top, D-pad and A/B buttons below */
:root{
  --page:#0a0a12; --shell:#1b1d2e; --shell2:#131525; --ink:#000000; --edge:#ffffff;
  --text:#ffffff; --gold:#ffd23f; --goldsh:#5a2e00; --dim:#8c93c0; --hp:#ff6b6b; --btn:#2c2f48; --btnA:#c8453a; --btnB:#3a5fc8;
  --pix:"DotGothic16","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",monospace;
  --W:400px; --u:calc(var(--W)/176);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--text);font-family:var(--pix);-webkit-font-smoothing:none;overflow-x:hidden}
.wrap{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#screen{position:relative;width:var(--W);height:var(--W);max-width:100%;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 4px var(--shell),0 0 0 6px #000}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.w{position:absolute;box-sizing:border-box;background:#000;border:calc(var(--u)*1.2) solid var(--edge);border-radius:calc(var(--u)*3);box-shadow:0 0 0 calc(var(--u)*0.8) #000;
   font-size:calc(var(--u)*8);line-height:calc(var(--u)*12);padding:calc(var(--u)*2.5) calc(var(--u)*5);color:var(--text);white-space:pre-wrap;word-break:break-all;overflow:visible}
.w .ttl{position:absolute;top:calc(var(--u)*-1.5);left:50%;transform:translate(-50%,-50%);background:#000;padding:0 calc(var(--u)*3);font-size:calc(var(--u)*7);line-height:1;white-space:nowrap}
#msg .more{position:absolute;left:50%;bottom:calc(var(--u)*1);transform:translateX(-50%);font-size:calc(var(--u)*6);line-height:1}
.opts{display:grid;gap:0 calc(var(--u)*4)}
.opt{font:inherit;color:inherit;background:none;border:0;padding:0 0 0 calc(var(--u)*8);text-align:left;position:relative;cursor:pointer;line-height:calc(var(--u)*12);white-space:nowrap}
.opt::before{content:"▶";position:absolute;left:0;font-size:calc(var(--u)*6);visibility:hidden}
.opt.on::before{visibility:visible;animation:bl .7s steps(2,end) infinite}
.opt:disabled{color:#666}
.blink{animation:bl 1s steps(2,end) infinite}
@keyframes bl{50%{opacity:0}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;text-align:center}
.logo{margin-top:calc(var(--u)*14);font-size:calc(var(--u)*21);line-height:1.08;color:var(--gold);letter-spacing:.04em;
  text-shadow:calc(var(--u)*1.2) 0 var(--goldsh),calc(var(--u)*-1.2) 0 var(--goldsh),0 calc(var(--u)*1.2) var(--goldsh),0 calc(var(--u)*-1.2) var(--goldsh),calc(var(--u)*1.2) calc(var(--u)*1.2) var(--goldsh),calc(var(--u)*-1.2) calc(var(--u)*1.2) var(--goldsh),0 calc(var(--u)*3) rgba(0,0,0,.5)}
.sub{margin-top:calc(var(--u)*3);font-size:calc(var(--u)*7);color:#fff;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,0 0 calc(var(--u)*2) #000}
.big{margin-top:calc(var(--u)*10);font-size:calc(var(--u)*16);color:var(--gold);text-shadow:calc(var(--u)*1) 0 var(--goldsh),calc(var(--u)*-1) 0 var(--goldsh),0 calc(var(--u)*1) var(--goldsh),0 calc(var(--u)*-1) var(--goldsh)}
.pad{width:var(--W);max-width:100%;display:flex;justify-content:space-between;align-items:center;padding:4px 6px;box-sizing:border-box}
#dpad{position:relative;width:150px;height:150px;touch-action:none;flex-shrink:0}
#dpad .arm{position:absolute;background:var(--btn);box-shadow:0 4px 0 #000}
#dpad .h{left:0;right:0;top:50px;height:50px;border-radius:8px}
#dpad .v{top:0;bottom:0;left:50px;width:50px;border-radius:8px}
#dpad .hub{position:absolute;left:62px;top:62px;width:26px;height:26px;border-radius:50%;background:#20223a}
#dpad .ar{position:absolute;color:#9aa0c8;font-size:16px;line-height:1;pointer-events:none}
#dpad.d-up .v,#dpad.d-down .v,#dpad.d-left .h,#dpad.d-right .h{background:#3a3e60}
.ab{display:flex;gap:14px;align-items:center;transform:rotate(-14deg);flex-shrink:0}
.btn{width:66px;height:66px;border-radius:50%;border:0;font:inherit;font-size:22px;color:#fff;box-shadow:0 5px 0 #000;cursor:pointer;touch-action:none}
.btn:active,.btn.pr{transform:translateY(3px);box-shadow:0 2px 0 #000}
#bA{background:var(--btnA);margin-top:-30px} #bB{background:var(--btnB);margin-top:30px}
.btn:focus-visible,#snd:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{width:var(--W);max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);gap:8px}
#snd{font:inherit;font-size:12px;color:#fff;background:var(--shell);border:2px solid var(--dim);border-radius:6px;padding:5px 8px;cursor:pointer}
.bar a{color:var(--gold);text-decoration:none;border:1px solid var(--gold);border-radius:6px;padding:4px 8px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.blink,.opt.on::before{animation:none}}
</style>

    if(c==='~'){drawSea(sx,sy,tx,ty,t);continue}g.drawImage(tileImg(c),sx,sy);

  const pw=S.walk?S.walk.p:0;const frame=S.walk?(Math.floor((S.walk.n+pw)*2)%2):0;

    for(let yy=0;yy<SW;yy+=2)for(let xx=0;xx<SW;xx+=2){const d=Math.hypot(xx-pcx,yy-pcy)/r;const de=hasE?Math.hypot(xx-ex,yy-ey)/(TS*1.6):9;const dd=Math.min(d,de);if(dd>0.75){const th=BAY[((yy>>1)&3)*4+((xx>>1)&3)]/16;if(dd>1||th<(dd-0.75)*4){g.fillStyle='#000';g.fillRect(xx,yy,2,2)}}}}
}

function frame0(nt){const t=nt/1000,dt=Math.min(0.05,(nt-last)/1000);last=nt;
  S.red=Math.max(0,S.red-dt*2.5);S.flash=Math.max(0,S.flash-dt*2);S.shakeT=Math.max(0,S.shakeT-dt*3);
  if(S.battle&&S.battle.e){S.battle.e.shake=Math.max(0,S.battle.e.shake-dt*3);S.battle.e.blink=Math.max(0,S.battle.e.blink-dt)}
  stepField(dt);
  g.save();if(S.shakeT>0&&!RM)g.translate(Math.round(Math.sin(t*80)*3*S.shakeT),Math.round(Math.cos(t*67)*2*S.shakeT));
  if(S.mode==='title')drawTitle(t);else if(S.mode==='ending')drawEnding(t);else if(S.mode==='battle')drawBattle(t);else drawWorld(t);
  if(S.sparkle&&rnd()<(RM?0.15:0.5))S.parts.push({x:rnd()*SW,y:rnd()*100+4,vx:0,vy:-5,life:0.9,c:rnd()<0.5?'#ffd23f':'#ffffff',tw:1});
  S.parts=S.parts.filter(p=>(p.life-=dt)>0);for(const p of S.parts){p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;g.fillStyle=p.c;if(p.tw){g.fillRect(p.x|0,p.y|0,1,1);if(p.life>0.45){g.fillRect((p.x|0)-1,p.y|0,3,1);g.fillRect(p.x|0,(p.y|0)-1,1,3)}}else g.fillRect(p.x|0,p.y|0,2,2)}
  g.restore();
  if(S.red>0){g.fillStyle=`rgba(255,40,70,${S.red*0.35})`;g.fillRect(0,0,SW,SW)}
  if(S.flash>0){g.fillStyle=`rgba(255,253,240,${Math.min(1,S.flash)})`;g.fillRect(0,0,SW,SW)}
  if(S.dark>0){g.fillStyle=`rgba(0,0,0,${Math.min(1,S.dark)})`;g.fillRect(0,0,SW,SW)}}

  let idx=o.start||0;const btns=opts.map((t,i)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=t;if(o.disabled&&o.disabled[i])b.disabled=true;

    if(k==='up')r=(r-1+rows)%rows;else if(k==='down')r=(r+1)%rows;else if(k==='left')c=(c-1+cols)%cols;else if(k==='right')c=(c+1)%cols;
    else if(k==='A'){if(btns[idx].disabled){SFX.no();return}if(o.sync&&o.sync[idx])o.sync[idx]();done(idx);return}else if(k==='B'){if(o.cancel!==false)done(-1);return}
    let j=r*cols+c;if(j>=n)j=n-1;set(j)}};

const dpad=$('dpad');let padDir=null,padT=0,repT=0;

  const tx=Math.floor((sx+(cx-5)*TS)/TS),ty=Math.floor((sy+(cy-5)*TS)/TS);
  if(tx===P.x&&ty===P.y&&!S.walk){fieldMenu();return}

const heldDir=()=>padDir||[...IN.keys].pop()||null;
function findPath(tx,ty){
  const goal=tileAt(P.map,tx,ty);const solid=SOLID.has(goal);const sx=S.walk?P.x:P.x,sy=S.walk?P.y:P.y;
  const key=(x,y)=>x+','+y;const prev=new Map([[key(sx,sy),null]]);const q=[[sx,sy]];let found=null;
  while(q.length){const[x,y]=q.shift();
    if(solid?(Math.abs(x-tx)+Math.abs(y-ty)===1):(x===tx&&y===ty)){found=[x,y];break}
    for(const d of['up','down','left','right']){const[dx,dy]=DV[d];const nx=x+dx,ny=y+dy;if(Math.abs(nx-sx)>14||Math.abs(ny-sy)>14)continue;const k=key(nx,ny);if(prev.has(k))continue;const tc=tileAt(P.map,nx,ny);if(SOLID.has(tc))continue;if('ELDU'.includes(tc)&&!(nx===tx&&ny===ty))continue;prev.set(k,[x,y,d]);q.push([nx,ny])}}
  if(!found)return null;const steps=[];let k=key(...found);while(prev.get(k)){const[x,y,d]=prev.get(k);steps.unshift(d);k=key(x,y)}
  let bump=null;if(solid)bump=found[0]<tx?'right':found[0]>tx?'left':found[1]<ty?'down':'up';if(bump)steps.push(bump);return{steps,bump}}

function stepField(dt){

  if(S.walk){const st=IN.bHeld?0.075:(SET.walk==='fast'?0.12:0.17);S.walk.p+=dt/st;if(S.walk.p>=1){S.walk=null;arrive()}return}
  if(IN.choice||IN.res||IN.typing)return;
  let d=heldDir();if(d)S.path=[];else if(S.path.length)d=S.path.shift();
  if(!d){if(!S.idleT)S.idleT=performance.now();else if(performance.now()-S.idleT>350&&statW.hidden)showStatus();return}
  S.idleT=0;showStatus(false);P.dir=d;const[dx,dy]=DV[d];const nx=P.x+dx,ny=P.y+dy;const c=tileAt(P.map,nx,ny);
  if(SOLID.has(c)){S.path=[];if(!S.bumpT||performance.now()-S.bumpT>260){S.bumpT=performance.now();SFX.bump();bumpEvent(c,nx,ny)}return}
  if(P.oya){const lt=S.trail[0]||{x:P.x,y:P.y,dir:P.dir};S.trail=[{x:P.x,y:P.y,px:lt.x,py:lt.y,dir:dirTo(lt.x,lt.y,P.x,P.y)||lt.dir}]}

function dirTo(ax,ay,bx,by){if(bx>ax)return'right';if(bx<ax)return'left';if(by>ay)return'down';if(by<ay)return'up';return null}

function zone(){const c=tileAt(P.map,P.x,P.y);if(P.map==='b2')return'deep';if(P.map==='cave')return'cave';if(c==='T')return'forest';if(c===','||c==='=')return'grass';return'beach'}

function pickEnemy(){if(rnd()<1/48)return'gball';const z=zone();let L;
  if(z==='deep')L=['mist2','bat2','rcrab'];else if(z==='cave')L=['mist','bat'];
  else if(z==='forest')L=['crow','hop2','crow','pball'];

  else{if(P.y<9)L=['pball','dwave','wave'];else if(P.y<14)L=['crab','jelly','gull'];else L=['ball','ball','crab','jelly'];if(nearSea()&&P.y>=9)L=L.concat(['wave'])}
  return L[Math.floor(rnd()*L.length)]}

  if(P.map==='cave'&&!S.sawLight&&!P.cleared&&Math.hypot(P.x-1,P.y-1)<5){S.sawLight=1;S.path=[];return run(async()=>{await say('でぐちの ひかりが みえる！');hideMsg()})}

  if(rnd()<rate){safe=4;S.path=[];run(()=>battle(pickEnemy()))}
  else if(P.a&&EQ[P.a].regen&&P.hp<P.mhp&&steps%4===0)P.hp=Math.min(P.mhp,P.hp+1)}

async function homeEvent(){bgm(null);await sleep(120);SFX.ok();
  while(true){await say('おぴょの おうちだ。',{wait:false});const c=await choose(['やすむ','かいもの','きろくする','でかける'],{pos:[100,60,72]});
    if(c===0){await tween(500,p=>S.dark=p);await sleep(SFX.rest()*1000);P.hp=P.mhp;P.mp=P.mmp;save();await tween(500,p=>S.dark=1-p);S.dark=0;showStatus(true);await say('おぴょは ぐっすり ねむった。\nHPと やるきが ぜんぶ もどった！\n（きろくしました）')}
    else if(c===1)await shop();
    else if(c===2){save();SFX.ok();await say('きろくしました')}
    else break}
  await say('おぴょは また あるきだした');hideMsg();bgm('field')}
const SHOP=[['it','snack'],['it','bone'],['it','milk'],['eq','rope'],['eq','ballw'],['eq','frisbee'],['eq','red'],['eq','bandana'],['eq','harness']];
async function shop(){bgm('shop');
  while(true){showStatus(false);await say(`なにを かう？（コイン ${P.gold}）`,{wait:false});
    const c=await choose(SHOP.map(([t,k])=>{const d=t==='it'?IT[k]:EQ[k];const own=t==='eq'&&(P.w===k||P.a===k);return`${d.n}${own?'＊':''} ${d.price}`}),{pos:[44,2,128],title:'おやつや'});
    if(c<0)break;const[t,k]=SHOP[c];const d=t==='it'?IT[k]:EQ[k];
    if(P.gold<d.price){SFX.no();await say('コインが たりない…');continue}
    if(t==='it'){if((P.inv[k]||0)>=9){await say('もう もちきれない');continue}P.gold-=d.price;P.inv[k]=(P.inv[k]||0)+1;SFX.coin();await say(`${d.n}を かった！`)}
    else{if(P.w===k||P.a===k){await say('もう そうびしている');continue}const cur=d.s==='w'?P.w:P.a;if(cur&&EQ[cur].v>=d.v){await say('いまの そうびの ほうが つよいよ');continue}P.gold-=d.price;SFX.coin();await equip(k,false)}}
  bgm(null);showStatus(false)}
async function symPrompt(key){const D=EN[key];
  if(key==='boss'){await say('おおきな なみが\nどうくつの まえを ふさいでいる！',{wait:false});await sleep(300)}
  else await say(`${D.n}が いる！\nとても つよそうだ…`,{wait:false});
  await say('たたかいますか？',{add:true,wait:false});const c=await choose(['はい','いいえ'],{pos:[120,80,52]});if(c!==0){await say('おぴょは すこし はなれた');hideMsg();return}
  const rec={boss:5,nkani:12,kboss:16,nushi:24}[key];
  if(P.lv<rec){await say(`…ほんとうに いいの？\nレベル${rec}くらいは ほしいぴょ`,{wait:false});const c2=await choose(['いく','やめる'],{pos:[120,80,52]});if(c2!==0){hideMsg();return}}
  await battle(key)}
async function enterCave(){await warp('cave',9,13,'up','cave');S.sawLight=0;
  await say(P.oya?'どうくつに はいった。\nまっくらだ…\nおやぶんが となりに いる':'どうくつに はいった。\nまっくらだ…');hideMsg()}

/* ================= battle ================= */
function dmg(atk,def,mul=1){const base=atk*mul-def/2;if(base<=1)return rnd()<0.5?1:0;return Math.max(1,Math.round(base*(0.82+rnd()*0.36)))}
async function battle(key){
  const D=EN[key];const boss=!!D.boss;P.fights++;
  bgm(null);SFX.enc();S.busy=true;for(let i=0;i<6;i++){S.flash=0.7;await sleep(60);S.flash=0;await sleep(45)}
  S.battle={bg:P.map==='b2'?'deep':P.map==='cave'?'cave':zone(),e:{img:D.img,big:boss,alpha:0,shake:0,blink:0,sleep:0},oyaIn:0};S.mode='battle';
  bgm(boss?'boss':'battle');
  const e={n:D.n,hp:D.hp+(boss?0:RI(0,2)),mhp:0,atk:D.atk,def:D.def,agi:D.agi,mul:1};e.mhp=e.hp;
  await tween(300,p=>S.battle.e.alpha=p);showStatus(true);
  await say(D.gold?`${e.n}が あらわれた！\nぴかぴか ひかっている！`:`${e.n}が あらわれた！`);
  let primed=false,guard=false,turn=0,oyaHere=P.oya,result=null,charged=false;
  const surprise=!boss&&rnd()<0.07;
  while(!result){turn++;guard=false;let skipP=turn===1&&surprise;
    if(skipP)await say(`${e.n}は いきなり おそいかかってきた！`);
    if(!skipP){
      if(IN.auto&&P.hp<P.mhp*0.35){IN.auto=false;showStatus(true);await say('あぶない！ オートを とめた')}
      lines=[];setMsg();msgW.hidden=false;await say('おぴょは どうする？',{wait:false});
      const c=await choose(['たたかう','スキル','くんくん','ようすをみる','どうぐ','にげる','オート'],{pos:[60,4,112],cols:2,cancel:false,title:'コマンド',auto:IN.auto?0:null});
      let act=c;if(c===6){IN.auto=true;showStatus(true);act=0}
      if(act===0){P.cmd[0]++;await say('おぴょの こうげき！',{wait:false});await sleep(200);
        const crit=primed||rnd()<1/24;primed=false;
        if(crit){const d=Math.round(ATK()*1.7+RI(0,3));SFX.crit();await say('すごい いちげき！',{add:true,wait:false});await hitE(e,d)}
        else if(rnd()<0.05){SFX.miss();await say('ミス！ あたらなかった',{add:true})}
        else await hitE(e,dmg(ATK(),e.def))}
      else if(act===1){const r=await useSkill(e,boss,D);if(r==='cancel'){turn--;continue}if(r==='primed')primed=true}
      else if(act===2){P.cmd[1]++;P.kun++;await say('おぴょは くんくん においを かいだ…',{wait:false});await sleep(350);primed=true;
        await say(`${e.n}の すきを みつけた！`,{add:true});const pc=e.hp/e.mhp;await say(`（のこり HPは ${pc>0.7?'まだ たっぷり':pc>0.35?'はんぶんくらい':'あと すこし'}）`,{add:true});
        if(rnd()<0.25&&(P.inv.snack||0)<9){P.inv.snack=(P.inv.snack||0)+1;SFX.up();await say('おやつも 1こ みつけた！',{add:true})}}
      else if(act===3){P.cmd[2]++;guard=true;await say('おぴょは ようすを みている…',{wait:false});await sleep(450);
        if(P.mp<P.mmp){P.mp++;showStatus(true)}
        if(!boss&&!D.gold&&rnd()<0.18){await say(`${e.n}は あきて どこかへ いった`,{add:true});await fadeE();result='leave';break}
        await say(rnd()<0.35?'…なにも おこらなかった':'みがまえて いる。やるきが 1 もどった',{add:true})}
      else if(act===4){if(!(await itemMenu(true))){turn--;continue}}
      else if(act===5){if(boss){await say('にげられない！')}else{const ch=Math.max(0.2,Math.min(0.9,0.55+(P.agi-e.agi)*0.04));await say('おぴょは にげだした！',{wait:false});SFX.run();await sleep(350);if(rnd()<ch){await fadeE();result='run';break}await say('しかし にげられなかった！',{add:true})}}
      if(e.hp<=0){result='win';break}}
    if(key==='boss'&&!oyaHere&&(turn>=3||P.hp<P.mhp*0.45)){oyaHere=true;await oyabunArrives()}
    if(oyaHere&&e.hp>0&&(boss||rnd()<0.4)){await say('おやぶんの かみつき！',{wait:false});SFX.bark();await sleep(260);await hitE(e,Math.round(12+P.lv*1.3+RI(0,4)),true);if(e.hp<=0){result='win';break}}
    if(P.a&&EQ[P.a].regen&&P.hp<P.mhp){P.hp=Math.min(P.mhp,P.hp+EQ[P.a].regen);showStatus(true)}
    // enemy
    if(D.gold&&rnd()<0.45){await say(`${e.n}は ころがって にげていった！`);await fadeE();result='flee';break}
    if(S.battle.e.sleep>0){S.battle.e.sleep--;await say(S.battle.e.sleep>0?`${e.n}は ぐうぐう ねむっている`:`${e.n}は めを さました！`);continue}
    if(charged){charged=false;await say(`${e.n}の いちばん つよい こうげき！！`,{wait:false});if(D.salt)SFX.wave();await sleep(400);let d=dmg(e.atk*e.mul,DEF(),1.7);if(guard)d=Math.ceil(d/2);if(D.salt)P.salt++;await hurt(d)}
    else{const A=D.acts[boss?Math.floor(rnd()*D.acts.length):(rnd()<0.75?0:1)];
      if(A[1]===0){if(boss&&rnd()<0.6)charged=true;await say(`${e.n}は ${A[0]}`)}
      else{await say(`${e.n}は ${A[0]}`,{wait:false});if(D.salt)SFX.wave();await sleep(320);
        if(D.steal&&rnd()<0.25&&(P.inv.snack||0)>0){P.inv.snack--;showStatus(true);await say('おやつを 1こ とられた！',{add:true})}
        else{for(let h=0;h<A[1];h++){let d=dmg(e.atk*e.mul,DEF());if(guard)d=Math.max(1,Math.ceil(d/2));if(D.salt)P.salt++;await hurt(d);if(P.hp<=0)break}}}}
    if(P.hp<=0){result='lose';break}}
  IN.auto=false;
  if(result==='win'){
    if(key==='boss'){await say('おやぶん と おぴょの\nダブル ワン！！',{wait:false});SFX.bark();await sleep(240);SFX.bark();await sleep(200);SFX.boom();S.flash=1.3;S.shakeT=1;burst(88,80,30,['#ffffff','#ffd23f','#9ad8ff'],120,90);await sleep(700)}
    await fadeE();bgm(null);await sleep(SFX.win()*600);P.zk[key]=(P.zk[key]||0)+1;
    await say(`${e.n}を やっつけた！`);P.exp+=D.exp;P.gold+=D.g;await say(`けいけんち ${D.exp}\nコイン ${D.g}まいを かくとく`,{add:true});
    if(D.rare&&rnd()<D.rare[1]){await give(['it',D.rare[0],1])}
    if(D.drop)await equip(D.drop,true);
    while(P.lv<MAXLV&&P.exp>=EXPT[P.lv+1])await levelUp();
    if(D.boss){P.beat[D.boss]=true}
    if(key==='boss'){await say('おおきな なみは しずかに なった…');P.oya=true;S.trail=[{x:P.x,y:P.y+1,px:P.x,py:P.y+1,dir:'up'}];showStatus(true);await sleep(SFX.join()*500);await say('おやぶんが なかまに くわわった！')}
    if(key==='nushi'){await say('うみの ぬしを たおした！\nしょうごう「うみの ゆうしゃ」を\nてにいれた！');P.nushiT=1}
    save()}
  else if(result==='lose'){bgm(null);await say('おぴょは つかれて\nねむってしまった…');await tween(700,p=>S.dark=p);await sleep(SFX.fall()*1000);
    P.map='field';P.x=17;P.y=20;P.dir='up';P.hp=P.mhp;P.mp=P.mmp;P.gold=Math.floor(P.gold/2);S.trail=[{x:17,y:21,px:17,py:21,dir:'up'}];S.mode='field';S.battle=null;hideMsg();save();await sleep(300);await tween(600,p=>S.dark=1-p);S.dark=0;showStatus(true);
    await say('…おうちで めを さました。\nコインが はんぶんに なった');hideMsg();bgm('field');S.busy=false;return}
  hideMsg();S.mode='field';S.battle=null;showStatus(false);bgm(P.map==='b2'?'deep':P.map==='cave'?'cave':'field');S.busy=false;safe=5}
async function hitE(e,d,oya){if(d<=0){SFX.miss();await say(`${e.n}に ダメージを あたえられない！`,{add:true});return}
  SFX.hit();S.battle.e.shake=1;S.battle.e.blink=0.4;burst(88,90,12,['#ffffff','#ffd23f','#9ad8ff'],80,120);e.hp-=d;await sleep(240);await say(`${e.n}に ${d}の ダメージ！`,{add:true})}
async function hurt(d){P.hp=Math.max(0,P.hp-d);S.red=1;S.shakeT=1;SFX.hurt();showStatus(true);await sleep(220);await say(`おぴょは ${d}の ダメージを うけた！`,{add:true})}
async function fadeE(){const e=S.battle.e;await tween(380,p=>e.alpha=1-p)}
async function useSkill(e,boss,D){
  const L=learned();if(!L.length){await say(P.lv<3?'まだ スキルを おぼえていない。\nレベル3で おぼえるよ':'つかえる スキルが ない');return'cancel'}
  const c=await choose(L.map(s=>`${s.n} ${s.mp}`),{pos:[40,4,132],title:`スキル（やるき ${P.mp}）`,disabled:L.map(s=>P.mp<s.mp)});if(c<0)return'cancel';
  const s=L[c];P.mp-=s.mp;showStatus(true);SFX.skill();
  if(s.k==='pero'||s.k==='perodx'){const b=P.hp;P.hp=s.k==='perodx'?P.mhp:Math.min(P.mhp,P.hp+25+P.lv*2);await say(`おぴょの ${s.n}！`,{wait:false});await sleep(250);SFX.heal();showStatus(true);await say(`HPが ${P.hp-b} かいふくした！`,{add:true});return}
  if(s.k==='tossin'){await say('おぴょの とっしん！',{wait:false});await sleep(300);await hitE(e,dmg(ATK(),e.def,1.8));return}
  if(s.k==='buns'){await say('おぴょの しっぽブンブン！',{wait:false});await sleep(300);if(e.mul<1){await say('…でも もう きいている',{add:true});return}e.mul=0.7;await say(`${e.n}は みとれて こうげきりょくが さがった！`,{add:true});return}
  if(s.k==='apo'){await say('ぽろみ語の じゅもん\n「あぽらぴ」！',{wait:false});await sleep(400);if(rnd()<(boss?0.4:0.85)&&!D.gold){S.battle.e.sleep=RI(2,3);SFX.sleep();await say(`${e.n}は ねむってしまった！`,{add:true})}else{SFX.miss();await say('…きかなかった',{add:true})}return}
  if(s.k==='maru'){await say('おぴょの まんまるアタック！',{wait:false});await sleep(250);for(let i=0;i<3&&e.hp>0;i++)await hitE(e,dmg(ATK(),e.def,0.85));return}
  if(s.k==='oyacall'){await say('「おやぶーん！」',{wait:false});SFX.bark();await sleep(300);await say('おやぶんの スーパーかみつき！',{add:true,wait:false});await sleep(250);await hitE(e,dmg(ATK(),e.def,3),true);return}
  if(s.k==='hikari'){await say('ひかりの おぴょ！！',{wait:false});S.flash=1.4;SFX.boom();await sleep(500);await hitE(e,dmg(ATK(),e.def,4));const b=P.hp;P.hp=Math.min(P.mhp,P.hp+Math.round(P.mhp/2));showStatus(true);await say(`HPが ${P.hp-b} かいふくした！`,{add:true});return}}
async function levelUp(){P.lv++;const h=RI(4,7),m=RI(1,3),a=RI(1,3),d=RI(1,2),s=RI(1,2);P.mhp+=h;P.hp+=h;P.mmp+=m;P.mp+=m;P.atk+=a;P.def+=d;P.agi+=s;
  await sleep(SFX.lvup()*300);showStatus(true);await say(`おぴょは レベル ${P.lv}に あがった！`);await say(`さいだいHP＋${h}　やるき＋${m}\nちから＋${a}　まもり＋${d}\nすばやさ＋${s}`);
  for(const sk of SK)if(sk.lv===P.lv){await sleep(SFX.learn()*600);await say(`おぴょは スキル「${sk.n}」を\nおぼえた！`)}}
async function oyabunArrives(){bgm(null);await sleep(300);await say('…とおくから くろい かげが\nはしってきた！',{wait:false});
  await tween(900,p=>S.battle.oyaIn=p*0.85);await sleep(200);SFX.bark();more.hidden=false;await waitA();more.hidden=true;
  bgm('hero');await sleep(SFX.join()*300);await say('おやぶん が かけつけた！');await tween(400,p=>S.battle.oyaIn=0.85*(1-p));P.oya=true;showStatus(true)}

/* ================= ending ================= */
function titleFor(){const[f,k,w]=P.cmd;const m=Math.max(f,k,w);if([f,k,w].filter(v=>v===m).length>1)return'きままな ぼうけんしゃ';return m===f?'なみうちぎわの ゆうしゃ':m===k?'はなの めいじん':'みまもりの たつじん'}
async function ending(){
  S.busy=true;bgm(null);await say('でぐちの ひかりに むかって\nはしった！',{wait:false});await sleep(600);
  for(let i=0;i<20;i++){S.light=i/20;await sleep(40)}S.flash=1.8;SFX.boom();await sleep(500);hideMsg();
  S.mode='ending';S.sparkle=true;showStatus(false);bgm('ending');await sleep(900);
  await say('おぴょは ひかりの どうくつを\nぬけた！');await say('まぶしい ひかりの むこうに\nいつもの はまべが ひろがっていた');
  await say(`レベル ${P.lv}\nかわいさ ＋10　くんくん ${P.kun}かい\nしょっぱさ たいせい ＋${P.salt}`);
  const ttl=titleFor();await sleep(SFX.join()*400);await say(`しょうごう「${ttl}」を\nてにいれた！`);
  if(P.oya)await say('おやぶんは しっぽを ふっている');
  $('endov').hidden=false;await say('しゅつえん　おぴょ\nとくべつしゅつえん　おやぶん');
  await say('…でも ぼうけんは まだ つづく。\nどうくつの おくや しまの どこかに\nつよい ぬしたちが いるらしい');
  P.cleared=true;P.map='field';P.x=17;P.y=20;P.dir='up';P.hp=P.mhp;P.mp=P.mmp;S.light=0;save();
  while(true){const txt=`おぴょの ぼうけん クリア！\nLv${P.lv} しょうごう「${ttl}」\nずかん ${ZK.filter(k=>P.zk[k]).length}/${ZK.length}\nhttps://poromi-oyabun.github.io/opyo-bouken/`;let ok=null;
    const c=await choose(['つづける','きろくを コピー'],{pos:[96,64,76],cancel:false,sync:{1:()=>{try{const p=navigator.clipboard&&navigator.clipboard.writeText(txt);ok=p?p.then(()=>true,()=>false):Promise.resolve(false)}catch(e){ok=Promise.resolve(false)}}}});
    if(c===0)break;const done=await(ok||Promise.resolve(false));if(done)await say('コピーしました\nThreadsに はりつけて つかえます');else await say(txt.split('\n').slice(0,3).join('\n'))}
  $('endov').hidden=true;hideMsg();S.sparkle=false;S.busy=false;titleScreen()}

/* ================= title ================= */
async function titleScreen(){
  S.mode='title';S.busy=true;S.light=0;S.sparkle=true;$('titleov').hidden=false;hideMsg();showStatus(false);bgm('title');
  const sv=store.get('opyo3');const has=!!(sv&&sv.v===3);
  const c=await choose(has?['つづきから','はじめから']:['はじめから'],{pos:[52,90,72],cancel:false});
  initAudio();$('titleov').hidden=true;S.sparkle=false;
  if(has&&c===1){S.mode='title';await say('きろくを けして\nはじめから あそびますか？',{wait:false});const c2=await choose(['はい','いいえ'],{pos:[120,80,52],cancel:false});hideMsg();if(c2!==0){return titleScreen()}}
  const cont=has&&c===0;if(cont)load();else newGame();
  S.trail=P.oya?[{x:P.x,y:P.y+1,px:P.x,py:P.y+1,dir:P.dir}]:[];S.path=[];
  S.mode='field';bgm(P.map==='b2'?'deep':P.map==='cave'?'cave':'field');S.flash=0.6;
  if(!cont){await say('おぴょは ぼうけんに でます');await say('さがさないで ください ぴょ');await say('じゅうじキー か がめんタップで あるく\nAボタンで コマンド\nBを おしながら あるくと ダッシュ');hideMsg();save()}
  else if(P.cleared&&!P.pg){P.pg=1;await say('どうくつの おくや しまの どこかに\nつよい ぬしたちが いるらしい…');hideMsg()}
  S.busy=false;S.idleT=0}
window.__G={P,S,IN,EN,press,setPad:d=>setPad(d),battle:k=>run(()=>battle(k)),save,get timeOrigin(){return performance.timeOrigin}};
const start=()=>titleScreen();
if(document.readyState==='loading')addEventListener('DOMContentLoaded',start);else start();
})();

</script>
