<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>おぴょの ぼうけん</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: one portrait column like a handheld screen; HUD window / scene window with overlays / message window / command bar */
:root{
  --page:#05071a; --ink:#0a0f33; --win:#122070; --win2:#0d1757;
  --edge:#f6f3e8; --text:#ffffff; --gold:#ffd23f; --goldsh:#5a2e00;
  --heart:#ff5c7c; --dim:#9aa6e0;
  --pix:"DotGothic16","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);background-image:radial-gradient(120% 60% at 50% 0%,#14205a 0%,var(--page) 70%);color:var(--text);font-family:var(--pix);-webkit-font-smoothing:none}
.wrap{max-width:460px;margin:0 auto;box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:14px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#game{display:flex;flex-direction:column;gap:12px;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.win{background:linear-gradient(var(--win),var(--win2));border:3px solid var(--edge);border-radius:8px;box-shadow:0 0 0 3px var(--ink),0 7px 0 3px rgba(0,0,0,.35)}
.hud{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:17px;line-height:1;white-space:nowrap;flex-wrap:nowrap}
.hud>*{flex-shrink:0}
[hidden]{display:none!important}
.hud img{width:28px;height:auto;image-rendering:pixelated}
.hud .lv{color:var(--dim)} .hud .lv b{color:var(--text);font-weight:400;font-variant-numeric:tabular-nums}
#hearts{color:var(--heart);letter-spacing:2px;font-size:19px}
#hearts .e{color:#4b5590}
#party{font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:3px 4px}
#snd{margin-left:auto;font:inherit;font-size:12px;color:var(--text);background:var(--ink);border:2px solid var(--dim);border-radius:6px;padding:6px 6px;cursor:pointer}
#snd:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stagewin{position:relative;padding:0;overflow:hidden}
#stage{display:block;width:100%;max-width:100%;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:5px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;text-align:center}
.logo{margin-top:7%;font-size:clamp(34px,11vw,50px);line-height:1.08;color:var(--gold);letter-spacing:.04em;
  text-shadow:3px 0 var(--goldsh),-3px 0 var(--goldsh),0 3px var(--goldsh),0 -3px var(--goldsh),3px 3px var(--goldsh),-3px 3px var(--goldsh),3px -3px var(--goldsh),-3px -3px var(--goldsh),0 7px rgba(0,0,0,.45)}
.sub{margin-top:8px;font-size:clamp(14px,4.2vw,18px);color:#fff;text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink)}
.blink{animation:bl 1s steps(2,end) infinite}
@keyframes bl{50%{opacity:0}}
.lvup{margin-top:6%;font-size:clamp(30px,10vw,44px);color:var(--gold);letter-spacing:.06em;
  text-shadow:3px 0 var(--goldsh),-3px 0 var(--goldsh),0 3px var(--goldsh),0 -3px var(--goldsh),3px 3px var(--goldsh),-3px 3px var(--goldsh),3px -3px var(--goldsh),-3px -3px var(--goldsh),0 7px rgba(0,0,0,.45)}
.lvsub{margin-top:4px;font-size:clamp(16px,5vw,22px);color:#fff;text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink);font-variant-numeric:tabular-nums}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.msgwin{padding:12px 14px;min-height:5.1em;position:relative}
#msg{font-size:clamp(17px,4.8vw,20px);line-height:1.6;white-space:pre-wrap;word-break:break-all;margin:0;min-height:3.2em}
#msg.sel{-webkit-user-select:text;user-select:text}
#more{position:absolute;right:12px;bottom:6px;color:var(--text);font-size:14px}
.cmdwin{display:flex;align-items:stretch;min-height:56px;padding:4px 6px}
#cmd{display:flex;flex:1;gap:4px;align-items:stretch;justify-content:center;flex-wrap:wrap}
.hint{align-self:center;color:var(--dim);font-size:14px;letter-spacing:.08em}
.opt{flex:1 1 0;min-width:0;min-height:46px;font:inherit;font-size:clamp(15px,4.4vw,18px);color:var(--text);background:none;border:0;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:2px;padding:4px 2px;white-space:nowrap}
.opt::before{content:"▶";font-size:.8em;visibility:hidden;color:var(--text)}
.opt.on::before{visibility:visible;animation:bl .8s steps(2,end) infinite}
.opt.on{background:rgba(255,255,255,.08)}
.opt:disabled{cursor:default}
.foot{color:#7d87bd;font-size:12px;line-height:1.7;text-align:center;letter-spacing:.04em}
.foot a{color:var(--gold);display:inline-block;margin-top:6px;padding:6px 10px;border:1px solid var(--gold);border-radius:6px;text-decoration:none}
@media (prefers-reduced-motion:reduce){.blink,.opt.on::before{animation:none}.pop{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <div id="game">
    <div class="win hud">
      <img id="hudface" alt="">
      <span>おぴょ</span>
      <span class="lv">Lv <b id="lv">9</b></span>
      <span id="hearts" aria-label="ハート"></span>
      <span id="party" hidden>おやぶん</span>
      <button id="snd" type="button" aria-pressed="true">♪ON</button>
    </div>
    <div class="win stagewin">
      <canvas id="stage" width="200" height="150" aria-label="ゲーム画面"></canvas>
      <div class="ov" id="titleov">
        <div class="logo">おぴょの<br>ぼうけん</div>
        <div class="sub">〜 ひかりの どうくつ 〜</div>
      </div>
      <div class="ov" id="lvov" hidden>
        <div class="lvup pop">LEVEL UP!</div>
        <div class="lvsub pop">Lv 9 → Lv 10</div>
      </div>
    </div>
    <div class="win msgwin"><p id="msg"></p><span id="more" class="blink" hidden>▼</span></div>
    <div class="win cmdwin"><div id="cmd"></div></div>
  </div>
  <p class="foot">タップで すすむ　コマンドを えらんで ぼうけん<br>おとが でます（♪ で きりかえ）<br><a href="https://www.threads.com/@oyabun.to.poromi" target="_blank" rel="noopener">Threads　@oyabun.to.poromi</a></p>
</div>

const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  try{
    if(AC){AC.resume&&AC.resume();return}
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:0.55;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
}
function tone(f,t0,dur,type='square',vol=0.07,f2=null,dest=master){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.006);g.gain.setValueAtTime(vol,t0+dur*0.65);g.gain.linearRampToValueAtTime(0,t0+dur);
  o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+0.03);
}
function noise(t0,dur,vol,ft='bandpass',f1=800,f2=null){
  if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(f1,t0);fl.Q.value=0.8;
  if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur+0.02);
}

  damage(){const t=now();tone(200,t,0.28,'square',0.09,55);noise(t,0.25,0.18,'lowpass',900)},

function bgm(name){
  if(!AC)return;if(cur&&cur.name===name)return;
  if(cur){const g=cur.g;g.gain.setTargetAtTime(0,AC.currentTime,0.06);setTimeout(()=>{try{g.disconnect()}catch(e){}},900)}
  if(!name){cur=null;return}
  const T=TRACKS[name];const g=AC.createGain();g.gain.value=1;g.connect(master);
  cur={name,T,g,vs:T.v.map(v=>({v,i:0,t:AC.currentTime+0.08}))};
}
setInterval(()=>{
  if(!cur||!AC)return;const e8=60/cur.T.bpm/2,ct=AC.currentTime;
  for(const vc of cur.vs){
    if(vc.t<ct-0.1)vc.t=ct+0.05;
    while(vc.t<ct+0.25){const[m,l]=vc.v.notes[vc.i];if(m)tone(mf(m),vc.t,l*e8*0.88,vc.v.type,vc.v.vol,null,cur.g);vc.t+=l*e8;vc.i=(vc.i+1)%vc.v.notes.length}
  }
},60);

const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function band(x,y0,y1,cols){
  for(let y=y0;y<y1;y++){const t=(y-y0)/Math.max(1,(y1-y0-1))*(cols.length-1);const i=Math.min(cols.length-2,Math.floor(t)),f=t-i;
    for(let xx=0;xx<W;xx++){const th=(BAY[(y&3)*4+(xx&3)]+0.5)/16;x.fillStyle=f>th?cols[i+1]:cols[i];x.fillRect(xx,y,1,1)}}
}
const beach=mk(W,H);{const x=beach.getContext('2d');
  band(x,0,62,['#3f86e4','#5ea4f0','#86c1f6','#b8def9']);

function rockShape(x,x0,y0,w,h,seed,cols){
  for(let i=0;i<w;i++){const u=i/(w-1)*2-1;let hh=h*Math.pow(Math.max(0,1-u*u),0.55)+Math.sin(i*1.7+seed)*1.6+Math.sin(i*0.6+seed*2)*2;hh=Math.max(0,Math.round(hh));
    for(let j=0;j<hh;j++){const yy=y0-j;const shade=(u<-0.2?0:u>0.4?2:1);const top=j>=hh-1;x.fillStyle=top?cols[3]:((BAY[(yy&3)*4+((x0+i)&3)]>12)?cols[shade+1]:cols[shade]);x.fillRect(x0+i,yy,1,1)}}
}

function mkBall(r){const c=mk(2*r+1,2*r+1),x=c.getContext('2d');const cols=['#06060c','#12121c','#22222f','#3a3a50'];
  for(let yy=0;yy<=2*r;yy++)for(let xx=0;xx<=2*r;xx++){const dx=(xx-r)/r,dy=(yy-r)/r,d2=dx*dx+dy*dy;if(d2>1)continue;const nz=Math.sqrt(1-d2);let l=(-0.55*dx-0.6*dy+0.58*nz+1)/2;
    const th=(BAY[(yy&3)*4+(xx&3)]+0.5)/16-0.5;let i=Math.floor(l*3.2+th*0.8);i=Math.max(0,Math.min(3,i));x.fillStyle=cols[i];x.fillRect(xx,yy,1,1)}
  x.fillStyle='#b9bdd6';x.fillRect(r-7,r-9,4,2);x.fillRect(r-8,r-7,2,2);x.fillStyle='#ffffff';x.fillRect(r-7,r-9,2,1);return c}
const WAVE=["..........wwwww","........wwlllllww","......wwllbbbbbllw",".....wllbbbbbbbbblw","....wllbbbddddbbbbw","...wllbbbd....dbblw","...wlbbbd......dbw","..wllbbd........w","..wlbbbd",".wllbbbbd",".wlbkbbkbd","wllbkbbkbbd.....ww","wlbbbbbbbbbd...wllw","wlbbbbbbbbbbd.wllbbw","llbbbmmbbbbbbdwlbbbblw","lbbbbbbbbbbbbbbbbbbbbllw","bbbbbbbbbbbbbbbbbbbbbbbb","dddddddddddddddddddddddd"].map(r=>r.padEnd(24,'.'));

const NODES=7;

function drawEnemy(t){const e=S.enemy;if(!e||e.alpha<=0)return;g.save();g.globalAlpha=e.alpha;

function drawMap(t){if(!S.map)return;g.fillStyle='rgba(8,14,60,.85)';g.fillRect(6,4,W-12,13);g.fillStyle='#f6f3e8';g.fillRect(6,4,W-12,1);g.fillRect(6,16,W-12,1);g.fillRect(6,4,1,13);g.fillRect(W-7,4,1,13);

let last=performance.now();
function frame(nowt){const t=nowt/1000,dt=Math.min(0.05,(nowt-last)/1000);last=nowt;
  if(S.walking)S.scroll+=dt*34;
  S.flash=Math.max(0,S.flash-dt*2.2);S.red=Math.max(0,S.red-dt*2.5);S.shake=Math.max(0,S.shake-dt*3);if(S.enemy)S.enemy.shake=Math.max(0,S.enemy.shake-dt*3);

  S.parts=S.parts.filter(p=>(p.life-=dt)>0);for(const p of S.parts){p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;g.fillStyle=p.c;if(p.tw){const s=p.life>0.45?1:0;g.fillRect(p.x|0,p.y|0,1,1);if(s){g.fillRect((p.x|0)-1,p.y|0,3,1);g.fillRect(p.x|0,(p.y|0)-1,1,3)}}else g.fillRect(p.x|0,p.y|0,2,2)}

  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function burst(x,y,n,cols,sp=60,grav=80){for(let i=0;i<(RM?n/3:n);i++){const a=Math.random()*Math.PI*2,v=sp*(0.4+Math.random()*0.8);S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,g:grav,life:0.5+Math.random()*0.5,c:cols[i%cols.length]})}}

/* ---------- helpers ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tween=(ms,fn)=>new Promise(r=>{const t0=performance.now();const st=n=>{const p=Math.min(1,(n-t0)/ms);fn(p);p<1?requestAnimationFrame(st):r()};requestAnimationFrame(st)});
const msg=document.getElementById('msg'),more=document.getElementById('more'),cmd=document.getElementById('cmd');
const IN={typing:false,skip:false,tapRes:null,choice:null};
function adv(){if(IN.choice)return;if(IN.typing){IN.skip=true;return}if(IN.tapRes){const r=IN.tapRes;IN.tapRes=null;more.hidden=true;cmd.innerHTML='';r()}}
document.getElementById('game').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;initAudio();adv()});
addEventListener('keydown',e=>{const k=e.key;
  if(IN.choice){if(k==='ArrowRight'||k==='ArrowDown'){IN.choice.move(1);e.preventDefault()}else if(k==='ArrowLeft'||k==='ArrowUp'){IN.choice.move(-1);e.preventDefault()}else if(k==='Enter'||k===' '||k==='z'){IN.choice.pick();e.preventDefault()}return}
  if(k==='Enter'||k===' '||k==='z'){if(document.activeElement===snd&&k!=='z')return;initAudio();adv();e.preventDefault()}});
function tap(){more.hidden=false;cmd.innerHTML='<span class="hint">▼ タップで すすむ</span>';return new Promise(r=>IN.tapRes=r)}
async function say(text,wait=true){
  msg.classList.remove('sel');IN.typing=true;IN.skip=false;more.hidden=true;let i=0;const chars=[...text];
  await new Promise(res=>{const step=()=>{if(IN.skip){msg.textContent=text;return res()}i++;msg.textContent=chars.slice(0,i).join('');const c=chars[i-1];if(c&&c!==' '&&c!=='\n'&&c!=='…')SFX.blip();
    if(i>=chars.length)return res();setTimeout(step,c==='…'?150:c==='\n'?120:55)};step()});
  IN.typing=false;if(wait)await tap();
}
function choose(opts,sync={}){return new Promise(res=>{cmd.innerHTML='';let idx=0;const btns=opts.map((o,i)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=o;
    b.addEventListener('click',e=>{e.stopPropagation();if(sync[i])sync[i]();done(i)});b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')set(i)});cmd.append(b);return b});
  function set(i){if(i!==idx&&IN.choice)SFX.cursor();idx=i;btns.forEach((b,j)=>b.classList.toggle('on',j===idx))}
  function done(i){if(!IN.choice)return;IN.choice=null;SFX.select();btns.forEach((b,j)=>{b.disabled=true;b.classList.toggle('on',j===i)});setTimeout(()=>{cmd.innerHTML='';res(i)},170)}
  btns[0].classList.add('on');IN.choice={move:d=>set((idx+d+opts.length)%opts.length),pick:()=>done(idx)};})}

/* ---------- HUD ---------- */
const G={};
function hud(){const h=document.getElementById('hearts');h.innerHTML='';for(let i=0;i<G.max;i++){const s=document.createElement('span');s.textContent=i<G.hp?'♥':'♡';if(i>=G.hp)s.className='e';h.append(s)}
  document.getElementById('lv').textContent=G.lv;document.getElementById('party').hidden=!G.oya}
function hurt(){G.hp=Math.max(0,G.hp-1);S.red=1;S.shake=1;SFX.damage();hud()}
async function holdOn(){if(G.hp>0)return;await say('おぴょは ふんばった！');G.hp=1;hud();SFX.heal()}
function heal(){G.hp=G.max;hud();SFX.heal();burst(S.pol.x,S.pol.y-30,18,['#ff8fb0','#ffffff','#ffd23f'],45,-40)}
function hitE(){const e=S.enemy;e.shake=1;SFX.hit();burst(e.x,e.y-18,16,['#ffffff','#ffd23f','#9ad8ff'],80,120)}
async function enemyIn(e){S.enemy=Object.assign({alpha:0,shake:0,dx:0,flash:0},e);await tween(420,p=>S.enemy.alpha=(p<1&&Math.floor(p*8)%2)?0.25:1)}
async function enemyOut(kind='fade'){const e=S.enemy;if(!e)return;
  if(kind==='roll')await tween(900,p=>{e.dx=p*90;e.rot=p*9;e.alpha=1-p*p});
  else if(kind==='back')await tween(700,p=>{e.dx=p*40;e.alpha=1-p});
  else await tween(500,p=>e.alpha=(1-p)*((Math.floor(p*10)%2)?0.3:1));
  S.enemy=null}
async function stripes(mid){SFX.encounter();await tween(380,p=>S.stripes=p*0.5);mid&&mid();await sleep(80);await tween(380,p=>S.stripes=0.5+p*0.5);S.stripes=-1}
async function walk(node,text,{bg}={}){
  S.pol.img='stand';S.walking=true;S.map=true;const from=S.mapPos;tween(1300,p=>S.mapPos=from+(node-from)*p);
  await say(text);S.walking=false;}
const CMDS=['たたかう','くんくん','ようすをみる'];
async function battleStart(enemy,intro,track='battle'){
  await stripes(()=>{S.map=false;S.pol.img='stand';bgm(track)});await enemyIn(enemy);await say(intro);
}
function pose(k){S.pol.img=k}

/* ---------- events ---------- */
async function ev1(){
  await battleStart({type:'ball',x:140,y:122},'くろい まるいもの が あらわれた！');
  const c=await choose(CMDS);G.n[c]++;
  if(c===0){await say('おぴょの まえあし パンチ！',false);await sleep(150);hitE();await sleep(500);await tap();
    await say('くろい まるいものは ころころ ころがった',false);await enemyOut('roll');await tap();}
  else if(c===1){pose('kun');await say('くんくん…');await say('うみの においが する',false);G.kun++;SFX.up();await sleep(300);await tap();await say('くんくんが 1 あがった！');
    await enemyOut();await say('くろい まるいものは どこかへ いった');}
  else{pose('look');await say('ようすを みている…');await say('…なにも おこらなかった');await enemyOut();await say('くろい まるいものは きえていった');}
  pose('stand');bgm('field');
}
async function ev2(){
  await battleStart({type:'wave',x:140,y:124},'しょっぱい なみ が おしよせた！');
  const c=await choose(CMDS);G.n[c]++;
  if(c===0){await say('おぴょは なみに とびかかった！',false);await sleep(200);SFX.wave();hitE();await sleep(450);hurt();await sleep(400);await tap();
    await say('ざぶーん！ しょっぱい！');G.salt++;SFX.up();await say('しょっぱさ たいせいが 1 あがった！');await holdOn();await enemyOut('back');await say('しょっぱい なみは かえっていった');}
  else if(c===1){pose('kun');await say('くんくん… しおの においだ',false);G.kun++;SFX.up();await sleep(300);await tap();await say('くんくんが 1 あがった！');await enemyOut('back');await say('しょっぱい なみは かえっていった');}
  else{pose('look');await say('ようすを みている…',false);SFX.wave();await sleep(900);await tap();await say('なみは あしもとで とまった');await enemyOut('back');await say('おぴょは ぬれずに すんだ');}
  pose('stand');bgm('field');
}
async function ev3(){
  await battleStart({type:'hole',x:138,y:128},'あなを みつけた！');
  const c=await choose(CMDS);G.n[c]++;
  if(c===0){await say('あなに むかって ほえた！',false);await sleep(150);SFX.bark();S.enemy.shake=0.6;await sleep(500);await tap();await say('ワン！');await say('…へんじは なかった');}
  else if(c===1){pose('kun');await say('くんくん… なにか におう！');await say('ほりほり ほりほり',false);SFX.dig();for(let i=0;i<4;i++){burst(138,124,8,['#e9c98a','#c99f60'],50,160);await sleep(130)}await tap();G.kun++;
    await say('…なにも はいっていなかった');}
  else{pose('look');await say('あなを じっと みている…');await say('…なにも でてこなかった');}
  await enemyOut();pose('stand');bgm('field');
}
async function rest(){
  pose('sit');await say('ひとやすみした',false);await sleep(300);heal();await sleep(500);await tap();await say('HPが かいふくした！');pose('stand');
}
async function boss(){
  S.caveFront=true;
  await battleStart({type:'boss',x:146,y:128,hp:4,max:4},'ゴゴゴゴ…\nおおきな なみ が たちはだかった！','boss');
  let turn=0,boost=false,charge=false;const e=()=>S.enemy;
  while(true){turn++;
    const c=await choose(CMDS);G.n[c]++;
    if(c===0){pose('stand');const d=boost?2:1;boost=false;await say('おぴょの とびかかり！',false);await sleep(150);hitE();e().hp-=d;await sleep(450);await tap();
      await say(d===2?'かいしんの いちげき！':'おおきな なみが ぐらっと ゆれた！');}
    else if(c===1){pose('kun');await say('くんくん…');await say('なみの すきまを みつけた！');boost=true;G.kun++;}
    else{pose('look');await say('ようすを みている…');charge=true;await say('おおきな なみは ちからを ためている');}
    if(turn>=3||e().hp<=1)break;
    pose('stand');
    if(charge||turn===1){charge=false;await say('おおきな なみの ざぶーん！',false);SFX.wave();e().shake=0.5;await sleep(500);hurt();await sleep(350);await tap();await say('しょっぱい！');G.salt++;await holdOn();}
    else{await say('おおきな なみは ゆらゆら している');}
  }
  pose('stand');bgm(null);await sleep(300);
  await say('…とおくから くろい かげが はしってきた！',false);
  S.oya.vis=true;S.oya.x=-40;S.walking=true;await tween(900,p=>S.oya.x=-40+p*128);S.walking=false;await sleep(200);await tap();
  SFX.join();await say('おやぶん が かけつけた！');
  bgm('boss');
  await say('おやぶん と おぴょの\nダブル ワン！',false);SFX.bark();await sleep(260);SFX.bark();await sleep(200);SFX.boom();S.flash=1.2;S.shake=1;e().hp=0;hitE();burst(146,90,30,['#ffffff','#ffd23f','#9ad8ff'],120,90);await sleep(800);await tap();
  bgm(null);await enemyOut();await say('おおきな なみは しずかに なった');
  G.oya=true;hud();SFX.join();await say('おやぶん が なかまに くわわった！');
  bgm('field');
}
async function cave(){
  await stripes(()=>{S.bg='cave';S.caveFront=false;S.map=true;S.mapPos=6;S.light=0;S.oya.x=78;S.pol.x=40;bgm('cave')});
  S.walking=true;await say('どうくつに はいった');await say('まっくらだ…\nおやぶんが となりを あるいている');
  await say('でぐちの ひかりが みえる！',false);S.walking=true;await tween(2200,p=>S.light=p*p*0.9);S.walking=false;
  S.flash=1.6;SFX.boom();await sleep(200);
}
function titleFor(){const[f,k,w]=G.n;const m=Math.max(f,k,w);const c=[f,k,w].filter(v=>v===m).length;if(c>1)return'きままな ぼうけんしゃ';return m===f?'なみうちぎわの ゆうしゃ':m===k?'はなの めいじん':'みまもりの たつじん'}
async function ending(){
  S.bg='beach';S.rocks=false;S.caveFront=false;S.map=false;S.walking=false;S.pol={img:'smile',x:G.oya?72:100,y:144,vis:true};S.oya={img:'oyabun',x:140,y:144,vis:G.oya};S.sparkle=true;
  bgm(null);await sleep(500);
  const ov=document.getElementById('lvov');ov.hidden=false;ov.querySelectorAll('.pop').forEach(el=>{el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')});
  SFX.levelup();G.lv=10;hud();await sleep(1300);
  await say('おぴょは レベル 10 に あがった！');
  const kun=Math.max(1,G.kun),salt=Math.max(1,G.salt);G.title=titleFor();G.score={kun,salt};
  await say('かわいさ ＋10\nくんくん ＋'+kun+'\nしょっぱさ たいせい ＋'+salt);
  SFX.join();await say('しょうごう「'+G.title+'」を\nてにいれた！');
  bgm('field');
  if(G.oya)await say('おやぶんは しっぽを ふっている');
  await say('おしまい ぴょ\nしゅつえん　おぴょ\nとくべつしゅつえん　おやぶん',false);
  while(true){
    const txt='おぴょの ぼうけん クリア！\nLv10 しょうごう「'+G.title+'」\nかわいさ＋10 くんくん＋'+kun+' しょっぱさたいせい＋'+salt;
    let ok=null;
    const c=await choose(['もういちど','きろくを コピー'],{1:()=>{try{const p=navigator.clipboard&&navigator.clipboard.writeText(txt);ok=p?p.then(()=>true,()=>false):Promise.resolve(false)}catch(e){ok=Promise.resolve(false)}}});
    if(c===0)break;
    const done=await (ok||Promise.resolve(false));
    if(done){await say('コピーしました\nThreadsに はりつけて つかえます ぴょ',false);await sleep(1400)}
    else{await say(txt,false);msg.classList.add('sel');const r=document.createRange();r.selectNodeContents(msg);const s=getSelection();s.removeAllRanges();s.addRange(r);await sleep(300)}
  }
  document.getElementById('lvov').hidden=true;
}

/* ---------- main ---------- */
async function title(){
  resetScene();Object.assign(G,{hp:3,max:3,lv:9,kun:0,salt:0,n:[0,0,0],oya:false});hud();
  document.getElementById('titleov').hidden=false;bgm(null);
  S.sparkle=true;
  msg.textContent='';await say('タップして はじめる ぴょ',false);
  await choose(['はじめる']);initAudio();
  S.sparkle=false;document.getElementById('titleov').hidden=true;
}
async function run(){
  while(true){
    await title();
    S.pol={img:'stand',x:48,y:142,vis:true};S.flash=0.8;bgm('field');
    await say('おぴょは ぼうけんに でます');
    pose('smile');S.pol.y=144;await say('さがさないで ください ぴょ');S.pol.y=142;
    await walk(1,'おぴょは はまべを あるきだした');await ev1();
    await walk(2,'なみうちぎわへ むかった');await ev2();
    await walk(3,'すなはまを ずんずん すすむ');await ev3();
    S.rocks=true;await walk(4,'いわかげに ついた');await rest();
    await walk(5,'どうくつを めざした');await boss();
    await cave();
    await ending();
  }
}
const start=()=>run();
if(document.readyState==='loading')addEventListener('DOMContentLoaded',start);else start();
})();
</script>
