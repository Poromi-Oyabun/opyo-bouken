<style>
/* layout: a handheld console — square game screen on top, D-pad and A/B buttons below */
:root{
  --page:#0a0a12; --shell:#1b1d2e; --shell2:#131525; --ink:#000000; --edge:#ffffff;
  --text:#ffffff; --gold:#ffd23f; --goldsh:#5a2e00; --dim:#8c93c0; --hp:#ff6b6b; --btn:#2c2f48; --btnA:#c8453a; --btnB:#3a5fc8;
  --pix:"DotGothic16","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",monospace;
  --W:400px; --u:calc(var(--W)/176);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--text);font-family:var(--pix);-webkit-font-smoothing:none;overflow-x:hidden}
.wrap{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#screen{position:relative;width:var(--W);height:var(--W);max-width:100%;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 4px var(--shell),0 0 0 6px #000}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.w{position:absolute;box-sizing:border-box;background:#000;border:calc(var(--u)*1.2) solid var(--edge);border-radius:calc(var(--u)*3);box-shadow:0 0 0 calc(var(--u)*0.8) #000;
   font-size:calc(var(--u)*8);line-height:calc(var(--u)*12);padding:calc(var(--u)*2.5) calc(var(--u)*5);color:var(--text);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;overflow:visible}
.w .ttl{position:absolute;top:calc(var(--u)*-1.5);left:50%;transform:translate(-50%,-50%);background:#000;padding:0 calc(var(--u)*3);font-size:calc(var(--u)*7);line-height:1;white-space:nowrap}
#msg .more{position:absolute;left:50%;bottom:calc(var(--u)*1);transform:translateX(-50%);font-size:calc(var(--u)*6);line-height:1}
.opts{display:grid;gap:0 calc(var(--u)*4)}
.opt{font:inherit;color:inherit;background:none;border:0;padding:0 0 0 calc(var(--u)*8);text-align:left;position:relative;cursor:pointer;line-height:calc(var(--u)*12);white-space:nowrap}
.opt::before{content:"▶";position:absolute;left:0;font-size:calc(var(--u)*6);visibility:hidden}
.opt.on::before{visibility:visible;animation:bl .7s steps(2,end) infinite}
.opt:disabled{color:#666}
.blink{animation:bl 1s steps(2,end) infinite}
@keyframes bl{50%{opacity:0}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;text-align:center}
.logo{margin-top:calc(var(--u)*14);font-size:calc(var(--u)*21);line-height:1.08;color:var(--gold);letter-spacing:.04em;
  text-shadow:calc(var(--u)*1.2) 0 var(--goldsh),calc(var(--u)*-1.2) 0 var(--goldsh),0 calc(var(--u)*1.2) var(--goldsh),0 calc(var(--u)*-1.2) var(--goldsh),calc(var(--u)*1.2) calc(var(--u)*1.2) var(--goldsh),calc(var(--u)*-1.2) calc(var(--u)*1.2) var(--goldsh),0 calc(var(--u)*3) rgba(0,0,0,.5)}
.sub{margin-top:calc(var(--u)*3);font-size:calc(var(--u)*7);color:#fff;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,0 0 calc(var(--u)*2) #000}
.big{margin-top:calc(var(--u)*10);font-size:calc(var(--u)*16);color:var(--gold);text-shadow:calc(var(--u)*1) 0 var(--goldsh),calc(var(--u)*-1) 0 var(--goldsh),0 calc(var(--u)*1) var(--goldsh),0 calc(var(--u)*-1) var(--goldsh)}
.pad{width:var(--W);max-width:100%;display:flex;justify-content:space-between;align-items:center;padding:4px 6px;box-sizing:border-box}
#dpad{position:relative;width:150px;height:150px;touch-action:none;flex-shrink:0}
#dpad .arm{position:absolute;background:var(--btn);box-shadow:0 4px 0 #000}
#dpad .h{left:0;right:0;top:50px;height:50px;border-radius:8px}
#dpad .v{top:0;bottom:0;left:50px;width:50px;border-radius:8px}
#dpad .hub{position:absolute;left:62px;top:62px;width:26px;height:26px;border-radius:50%;background:#20223a}
#dpad .ar{position:absolute;color:#9aa0c8;font-size:16px;line-height:1;pointer-events:none}
#dpad.d-up .v,#dpad.d-down .v,#dpad.d-left .h,#dpad.d-right .h{background:#3a3e60}
.ab{display:flex;gap:14px;align-items:center;transform:rotate(-14deg);flex-shrink:0}
.btn{width:66px;height:66px;border-radius:50%;border:0;font:inherit;font-size:22px;color:#fff;box-shadow:0 5px 0 #000;cursor:pointer;touch-action:none}
.btn:active,.btn.pr{transform:translateY(3px);box-shadow:0 2px 0 #000}
#bA{background:var(--btnA);margin-top:-30px} #bB{background:var(--btnB);margin-top:30px}
.btn:focus-visible,#snd:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{width:var(--W);max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);gap:8px}
#snd{font:inherit;font-size:12px;color:#fff;background:var(--shell);border:2px solid var(--dim);border-radius:6px;padding:5px 8px;cursor:pointer}
.bar a{color:var(--gold);text-decoration:none;border:1px solid var(--gold);border-radius:6px;padding:4px 8px}
[hidden]{display:none!important}
.w.p2{border-color:#6aa8ff;box-shadow:0 0 0 calc(var(--u)*0.8) #000,0 0 calc(var(--u)*4) #3a78ff}
@media (prefers-reduced-motion:reduce){.blink,.opt.on::before{animation:none}}
</style>

    await say(isl?'…ほこらの まえで めを さました。\nコインが はんぶんに なった':'…おうちで めを さました。\nコインが はんぶんに なった');hideMsg();bgm(isl?'isle':'field');S.busy=false;return{r:'lose',turn}}
  finishBattle();return{r:result,turn}}
function red(d,guard,oyaGuard){if(oyaGuard)d=Math.max(1,Math.ceil(d*0.3));else if(guard)d=Math.max(1,Math.ceil(d/2));if(S.battle&&S.battle.aw>0)d=Math.max(1,Math.ceil(d*0.7));return d}
function finishBattle(){hideMsg();infoW.hidden=true;S.mode=S.rush?'cut':'field';S.battle=null;showStatus(false);if(!S.rush)bgm(musFor());S.busy=false;safe=5}
const musFor=()=>({b2:'deep',cave:'cave',isle:'isle',ruin:'ruin'})[P.map]||'field';

  pop(d,88+RI(-14,14),92,crit?'#ffd23f':oya?'#bfe6ff':'#ffffff',crit||d>=200);if(!oya)gauge(crit?14:8);await sleep(240);await say(e.n.length>8?`${e.n}に\n${d}の ダメージ！`:`${e.n}に ${d}の ダメージ！`,{add:true})}
async function hurt(d){P.hp=Math.max(0,P.hp-d);S.red=1;S.shakeT=1;SFX.hurt();pop(d,40,104,'#ff6b6b');gauge(Math.min(20,Math.round(d/P.mhp*70)));showStatus(true);await sleep(220);await say(`おぴょは ${d}の ダメージを うけた！`,{add:true})}

  P.awg=0;S.battle.aw=3;bgm(null);msgW.hidden=true;S.dark=0;S.battle.cutin={k:'aw',t0:tnow()};

async function oyaP2(e,used){

  if(o==='くろがねキバ'){SFX.boom();S.flash=1;S.shakeT=1;await say('くろがね おやぶんの ひっさつ\n「くろがねキバ」！！',{wait:false});await sleep(400);await hitE(e,Math.round(oyaDmg()*3.5),true);return'sp'}}
async function friendArrives(){const f=P.friend;S.battle.friendHere=true;S.battle.friendAw=f.w;SFX.join&&await sleep(SFX.join()*300);await say(`${f.n}（Lv${f.l}）が\nたすけに かけつけた！`)}
async function kujiraPhase2(e){bgm(null);S.shakeT=1.5;if(SFX.rumble)SFX.rumble();await say('ほしくいクジラは そらの ほしを\nぜんぶ のみこもうと している！');

  if(S.battle.oyaHere)await say('おやぶんが ちからづよく ほえた！');

  bgm('final')}

async function useSkill(e,boss,D,ctx={}){
  const L=learned().slice();
  if(S.battle&&S.battle.aw>0&&P.oyaAw&&ctx.oyaHere&&!ctx.combo)L.push({k:'futari',n:'★ふたりの ひかり',mp:24});
  if(!L.length){await say(P.lv<3?'まだ スキルを おぼえていない。\nレベル3で おぼえるよ':'つかえる スキルが ない');return'cancel'}
  const mh=msgW.hidden;msgW.hidden=true;const c=await choose(L.map(s=>`${s.n} ${s.mp}`),{pos:[36,4,136],title:`スキル（やるき ${P.mp}）`,disabled:L.map(s=>P.mp<s.mp)});msgW.hidden=mh;if(c<0)return'cancel';
  const s=L[c];P.mp-=s.mp;showStatus(true);SFX.skill();const am=AM();
  if(s.k==='pero'||s.k==='perodx'){const b=P.hp;P.hp=s.k==='perodx'?P.mhp:Math.min(P.mhp,P.hp+25+P.lv*2);await say(`おぴょの ${s.n}！`,{wait:false});await sleep(250);SFX.heal();showStatus(true);await say(`HPが ${P.hp-b} かいふくした！`,{add:true});return}
  if(s.k==='tossin'){await say('おぴょの とっしん！',{wait:false});await sleep(300);await hitE(e,dmg(ATK(),e.def,1.8*am));return}
  if(s.k==='buns'){await say('おぴょの しっぽブンブン！',{wait:false});await sleep(300);if(e.mul<1){await say('…でも もう きいている',{add:true});return}e.mul=Math.max(0.6,e.mul*0.7);await say(`${e.n}は みとれて\nこうげきりょくが さがった！`,{add:true});return}
  if(s.k==='apo'){await say('ぽろみ語の じゅもん\n「あぽらぴ」！',{wait:false});await sleep(400);if(rnd()<(boss?(D.big?0.25:0.4):0.85)&&!D.gold){S.battle.e.sleep=RI(2,3);SFX.sleep();await say(`${e.n}は ねむってしまった！`,{add:true})}else{SFX.miss();await say('…きかなかった',{add:true})}return}
  if(s.k==='maru'){await say('おぴょの まんまるアタック！',{wait:false});await sleep(250);for(let i=0;i<3&&e.hp>0;i++)await hitE(e,dmg(ATK(),e.def,0.85*am));return}
  if(s.k==='oyacall'){await say('「おやぶーん！」',{wait:false});SFX.bark();await sleep(300);await say((P.oyaAw?'くろがね ':'')+'おやぶんの スーパーかみつき！',{add:true,wait:false});await sleep(250);await hitE(e,dmg(ATK(),e.def,(P.oyaAw?4:3)*am),true);return}
  if(s.k==='hikari'){await say('ひかりの おぴょ！！',{wait:false});S.flash=1.4;SFX.boom();await sleep(500);await hitE(e,dmg(ATK(),e.def,4*am));const b=P.hp;P.hp=Math.min(P.mhp,P.hp+Math.round(P.mhp/2));showStatus(true);await say(`HPが ${P.hp-b} かいふくした！`,{add:true});return}
  if(s.k==='hoshi'){await say('おぴょの ほしふり！',{wait:false});await sleep(250);for(let i=0;i<5&&e.hp>0;i++){burst(40+rnd()*96,66,6,['#ffd23f','#fffbe0'],40,160);await hitE(e,dmg(ATK(),e.def,0.72*am))}return}
  if(s.k==='kizuna'){SFX.bark();await sleep(120);SFX.bark();const b=P.hp;P.hp=Math.min(P.mhp,P.hp+Math.round(P.mhp*0.6));const gg=P.aw&&!(S.battle.aw>0)&&P.awg<100;if(gg)P.awg=Math.min(100,P.awg+50);showStatus(true);await say('おぴょと おやぶんの\nきずなの とおぼえ！',{wait:false});await sleep(300);SFX.heal();await say(`HPが ${P.hp-b} かいふくした！${gg?'\nかくせいゲージが ぐんと たまった！':''}`,{add:true});return}
  if(s.k==='zen'){await say('おぴょの ぜんりょくダッシュ！！',{wait:false});S.shakeT=0.6;await sleep(300);await hitE(e,dmg(ATK(),e.def,2.8*am));return}
  if(s.k==='futari'){bgm(null);msgW.hidden=true;S.dark=0;S.battle.cutin={k:'combo',t0:tnow()};
    for(let i=0;i<10;i++){burst(40,100,8,['#bfe6ff','#ffffff'],80,-30);burst(136,100,8,['#ffd23f','#ffffff'],80,-30);await sleep(55)}
    const Lc=SFX.combo?SFX.combo():0.7;S.flash=1.4;S.shakeT=1.6;await sleep(Lc*600);
    await say('おぴょと おやぶんの\nがったいわざ「ふたりの ひかり」！！！',{wait:false});SFX.boom();await sleep(450);
    S.battle.cutin=null;await hitE(e,dmg(ATK()+oyaDmg(),e.def,5),false,true);bgm('awaken');return'combo'}}

/* ================= ending ================= */
function titleFor(){const[f,k,w]=P.cmd;const m=Math.max(f,k,w);if([f,k,w].filter(v=>v===m).length>1)return'きままな ぼうけんしゃ';return m===f?'なみうちぎわの ゆうしゃ':m===k?'はなの めいじん':'みまもりの たつじん'}
async function ending(){
  S.busy=true;bgm(null);await say('でぐちの ひかりに むかって\nはしった！',{wait:false});await sleep(600);
  for(let i=0;i<20;i++){S.light=i/20;await sleep(40)}S.flash=1.8;SFX.boom();await sleep(500);hideMsg();
  S.mode='ending';S.sparkle=true;showStatus(false);bgm('ending');await sleep(900);
  await say('おぴょは ひかりの どうくつを\nぬけた！');await say('まぶしい ひかりの むこうに\nいつもの はまべが ひろがっていた');
  await say(`レベル ${P.lv}\nかわいさ ＋10　くんくん ${P.kun}かい\nしょっぱさ たいせい ＋${P.salt}`);
  const ttl=titleFor();await sleep(SFX.join()*400);await say(`しょうごう「${ttl}」を\nてにいれた！`);
  if(P.oya)await say('おやぶんは しっぽを ふっている');
  $('endov').hidden=false;await say('しゅつえん　おぴょ\nとくべつしゅつえん　おやぶん');
  await say('…でも ぼうけんは まだ つづく。\nどうくつの おくや しまの どこかに\nつよい ぬしたちが いるらしい');
  P.cleared=true;P.map='field';P.x=17;P.y=20;P.dir='up';P.hp=P.mhp;P.mp=P.mmp;S.light=0;save();
  while(true){const txt=`おぴょの ぼうけん クリア！\nLv${P.lv} しょうごう「${ttl}」\nずかん ${ZK.filter(k=>P.zk[k]).length}/${ZK.length}\nhttps://poromi-oyabun.github.io/opyo-bouken/`;let ok=null;
    const c=await choose(['つづける','きろくを コピー'],{pos:[96,64,76],cancel:false,sync:{1:()=>{try{const p=navigator.clipboard&&navigator.clipboard.writeText(txt);ok=p?p.then(()=>true,()=>false):Promise.resolve(false)}catch(e){ok=Promise.resolve(false)}}}});
    if(c===0)break;const done=await(ok||Promise.resolve(false));if(done)await say('コピーしました\nThreadsに はりつけて つかえます');else await say(txt.split('\n').slice(0,3).join('\n'))}
  $('endov').hidden=true;hideMsg();S.sparkle=false;S.busy=false;titleScreen()}

/* ================= title ================= */
async function titleScreen(){
  S.mode='title';S.busy=true;S.light=0;S.sparkle=true;$('titleov').hidden=false;hideMsg();showStatus(false);bgm('title');
  const sv=store.get('opyo3');const has=!!(sv&&sv.v===3);$('titleov').querySelector('.sub').textContent=(sv&&sv.trueClear)?'〜 ほしふる しま 〜':'〜 ひかりの どうくつ 〜';

  S.trail=P.oya?[{x:P.x,y:P.y+1,px:P.x,py:P.y+1,dir:P.dir}]:[];S.path=[];

  else if(P.cleared&&!P.pg){P.pg=1;await say('どうくつの おくや しまの どこかに\nつよい ぬしたちが いるらしい…');hideMsg()}
  if(cont&&P.beat.nushi&&!P.turtleHint){P.turtleHint=1;await say('【だいがた アップデート】\nひがしの はまべに うみがめが\nきている らしい…');hideMsg();save()}
  S.busy=false;S.idleT=0}
window.__G={P,S,IN,EN,SK,RUSH,SET,readCode,myCode,tileAt,run,F:{battle,bossRush,shrineEvent,voyage,trueEnding,awakenScene,oyaAwakenScene,npcTalk,turtleEvent,giveStar},warpTo:(m,x,y,d)=>{P.map=m;P.x=x;P.y=y;P.dir=d||'down';S.trail=[{x,y:y+1,px:x,py:y+1,dir:'up'}];bgm(musFor())},press,setPad:d=>setPad(d),battle:k=>run(()=>battle(k)),save,get timeOrigin(){return performance.timeOrigin}};
